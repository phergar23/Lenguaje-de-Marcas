/* ============================================================
   Lenguajes de Marcas · 1.º DAM — rediseño
   Cada bloque tiene su color: el color dice en qué parte del curso estás.
   ============================================================ */
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#F5F7FA; --surface-3:#E8ECF2;
  --ink:#0F1726; --ink-2:#364052; --muted:#667185; --line:#D7DDE7; --line-2:#E5E9F0;
  --b0:#0B7A86; --b1:#CF4E17; --b2:#2760D6; --b3:#A87300; --b4:#15875A; --b5:#6C42CC; --b6:#C22E63;
  --acc:var(--b0);
  --acc-soft:color-mix(in srgb, var(--acc) 11%, var(--surface));
  --acc-line:color-mix(in srgb, var(--acc) 35%, var(--line));
  --ok:#15803D; --ok-soft:#DFF3E6; --mal:#BE232B; --mal-soft:#FBE3E4; --aviso:#8E5C00; --aviso-soft:#FBF0D6;
  --code-bg:#0D1320; --code-bg-2:#141C2D; --code-ink:#D5DDEA; --code-muted:#6E7C95;
  --t-kw:#C792EA; --t-str:#A5D6A7; --t-num:#F78C6C; --t-com:#6B7A92; --t-fn:#82AAFF; --t-tag:#F07178; --t-attr:#FFCB6B; --t-prop:#89DDFF; --t-sel:#FFCB6B; --t-punc:#8FA0BA;
  --shadow:0 1px 2px rgba(15,23,38,.05),0 8px 26px -12px rgba(15,23,38,.18);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0E15; --surface:#111722; --surface-2:#161E2C; --surface-3:#1C2537; --ink:#E7ECF4; --ink-2:#BAC4D3; --muted:#8490A4; --line:#253046; --line-2:#1C2638;
    --b0:#35C0CB; --b1:#FF8757; --b2:#6F9DFF; --b3:#F0BF4C; --b4:#4CCF8E; --b5:#A889FF; --b6:#FF6E9F;
    --ok:#4ACF84; --ok-soft:#10301F; --mal:#FF7A80; --mal-soft:#3A1719; --aviso:#F2BE55; --aviso-soft:#33280E;
    --code-bg:#080C14; --code-bg-2:#0E1420;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0A0E15; --surface:#111722; --surface-2:#161E2C; --surface-3:#1C2537; --ink:#E7ECF4; --ink-2:#BAC4D3; --muted:#8490A4; --line:#253046; --line-2:#1C2638;
    --b0:#35C0CB; --b1:#FF8757; --b2:#6F9DFF; --b3:#F0BF4C; --b4:#4CCF8E; --b5:#A889FF; --b6:#FF6E9F;
    --ok:#4ACF84; --ok-soft:#10301F; --mal:#FF7A80; --mal-soft:#3A1719; --aviso:#F2BE55; --aviso-soft:#33280E;
    --code-bg:#080C14; --code-bg-2:#0E1420;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.7);
}
[data-b="0"]{--acc:var(--b0)} [data-b="1"]{--acc:var(--b1)} [data-b="2"]{--acc:var(--b2)} [data-b="3"]{--acc:var(--b3)}
[data-b="4"]{--acc:var(--b4)} [data-b="5"]{--acc:var(--b5)} [data-b="6"]{--acc:var(--b6)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-variant-ligatures:none;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--acc) 28%,transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
sub,sup{line-height:0}

/* ---------------- estructura ---------------- */
#app{display:grid;grid-template-columns:304px minmax(0,1fr);min-height:100%}
#rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;scrollbar-width:thin}
#main{min-width:0;padding-inline:clamp(16px,3.4vw,48px);padding-block:30px 90px}
#vista{max-width:1180px;margin:0 auto}
#barra{display:none}
#velo{display:none}
@media (max-width:980px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;inset:0 auto 0 0;width:min(330px,88vw);z-index:60;transform:translateX(-104%);transition:transform .25s ease;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  #rail.abierto{transform:none}
  #velo.si{display:block;position:fixed;inset:0;background:rgba(6,10,18,.5);z-index:50}
  #barra{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;align-items:center;gap:10px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  #barra b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-size:16px}
  #main{padding-block:20px 70px}
}

/* ---------------- rail ---------------- */
.marca{display:flex;gap:12px;align-items:center;padding:20px 20px 14px}
.logo{width:42px;height:42px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--surface);font-family:var(--f-mono);font-weight:600;font-size:15px;letter-spacing:-.04em}
.logo i{font-style:normal;color:var(--b3)}
.marca b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.1;letter-spacing:-.01em}
.marca span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.marca .ver{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-size:11.5px;font-weight:650;letter-spacing:.02em}
.versionbox{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-top:14px;padding:10px 14px;border:1px solid var(--acc-line);border-radius:10px;background:var(--acc-soft);font-size:13.5px;color:var(--ink)}
.versionbox b{color:var(--acc)}
.versionbox .nov{color:var(--muted)}
.buscabtn{display:flex;align-items:center;gap:10px;margin:0 16px 10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--muted);cursor:pointer;text-align:left;font-size:14.5px}
.buscabtn:hover{border-color:var(--acc-line);color:var(--ink)}
.buscabtn kbd{margin-left:auto}
kbd{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface);color:var(--muted)}
.navmain{display:flex;flex-direction:column;gap:1px;padding:4px 10px 10px;border-bottom:1px solid var(--line-2)}
.navmain button{display:flex;align-items:center;gap:11px;background:none;border:0;padding:7px 10px;border-radius:9px;cursor:pointer;text-align:left;font-size:15px;color:var(--ink-2)}
.navmain button svg{width:18px;height:18px;flex:none;opacity:.75}
.navmain button:hover{background:var(--surface-2);color:var(--ink)}
.navmain button[aria-current="true"]{background:var(--surface-3);color:var(--ink);font-weight:600}
.navbloques{padding:8px 10px 18px;display:flex;flex-direction:column;gap:2px}
.navgrupo{border-radius:11px}
.navcab{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;width:100%;background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left}
.navcab:hover{background:var(--surface-2)}
.navcab .bn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;font-weight:600;background:var(--acc-soft);color:var(--acc)}
.navcab .bt{font-size:14.5px;font-weight:600;line-height:1.25;color:var(--ink)}
.navcab .bp{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.navcab .mini{grid-column:2/4;height:3px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:2px}
.navcab .mini i{display:block;height:100%;background:var(--acc)}
.navses{display:flex;flex-direction:column;padding:2px 0 8px 22px;position:relative}
.navses::before{content:"";position:absolute;left:24px;top:4px;bottom:12px;width:1px;background:var(--acc-line)}
.navlink{display:grid;grid-template-columns:38px 1fr 12px;align-items:start;gap:6px;background:none;border:0;padding:6px 8px 6px 14px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px;line-height:1.35;color:var(--ink-2);position:relative}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:1px}
.navlink .st{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);margin-top:5px}
.navlink.hecho .st{background:var(--acc);border-color:var(--acc)}
.navlink.parcial .st{background:linear-gradient(90deg,var(--acc) 50%,transparent 50%);border-color:var(--acc)}
.navlink[aria-current="true"]{background:var(--acc-soft);color:var(--ink);font-weight:600}
.navlink[aria-current="true"] .n{color:var(--acc)}
.navlink[aria-current="true"]::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--acc)}
.railpie{margin-top:auto;padding:14px 20px 18px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.railpie .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tema-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:3px 9px;font-size:12.5px;cursor:pointer}

/* ---------------- tipografía ---------------- */
h1,h2,h3,h4,h5{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.2vw,46px);line-height:1.04;letter-spacing:-.025em}
h2{font-family:var(--f-display);font-weight:650;font-size:clamp(23px,2.5vw,29px);line-height:1.15;letter-spacing:-.015em}
h3{font-family:var(--f-display);font-weight:650;font-size:21px;line-height:1.25;letter-spacing:-.01em}
h4{font-size:16.5px;font-weight:650}
p{margin:0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--surface-3);border:1px solid var(--line-2);border-radius:5px;padding:.08em .35em;white-space:break-spaces;overflow-wrap:anywhere}
strong{font-weight:650;color:var(--ink)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:650;color:var(--muted)}
.chipb{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--acc-soft);color:var(--acc);letter-spacing:.04em}
.chipb b{font-family:var(--f-mono);font-size:11.5px;background:var(--acc);color:var(--surface);border-radius:999px;padding:1px 7px;letter-spacing:0}
.lead{font-size:clamp(17px,1.6vw,19px);color:var(--ink-2);max-width:66ch;line-height:1.55}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------------- botones y chips ---------------- */
.b{appearance:none;border:1px solid transparent;background:var(--acc);color:var(--surface);font-weight:600;font-size:14.5px;padding:8px 15px;border-radius:10px;cursor:pointer;line-height:1.25;display:inline-flex;align-items:center;gap:7px;transition:filter .15s,transform .05s}
.b:hover{filter:brightness(1.08)}
.b:active{transform:translateY(1px)}
.b.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.b.sec:hover{background:var(--surface-2);filter:none;border-color:var(--acc-line)}
.b.sm{padding:5px 11px;font-size:13.5px}
.b[aria-pressed="true"]{background:var(--ok);color:#fff}
.b:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:2px 10px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.entrega{background:var(--aviso-soft);color:var(--aviso)}
.chip.acc{background:var(--acc-soft);color:var(--acc)}
.pill{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:14px;padding:5px 12px;border-radius:999px;cursor:pointer;line-height:1.3;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--acc-line)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
button.ref{appearance:none;background:var(--acc-soft);border:0;color:var(--acc);font-weight:600;font-size:.94em;padding:.05em .45em;border-radius:6px;cursor:pointer;font-family:inherit;line-height:inherit}
button.ref::before{content:"§ ";opacity:.6}
button.ref:hover{text-decoration:underline}
.ref-rota{color:var(--mal);text-decoration:line-through dotted}

/* ---------------- cabecera de página ---------------- */
.hero{position:relative;padding:4px 0 26px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.hero .fila1{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.hero h1{margin:4px 0 12px}
.sid{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--acc);border:1.5px solid var(--acc);border-radius:8px;padding:1px 8px}
.objetivo{display:flex;gap:14px;align-items:flex-start;max-width:74ch;background:var(--acc-soft);border-radius:var(--r);padding:14px 18px;margin-top:6px}
.objetivo .et{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--acc);white-space:nowrap;padding-top:3px}
.objetivo p{font-size:17px;color:var(--ink)}
.metas{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:14px;color:var(--muted);align-items:center}
.metas .m{display:inline-flex;align-items:center;gap:6px}
.fichasrel{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
.ruta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ruta button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:13px}
.ruta button:hover{color:var(--acc);text-decoration:underline}

/* ---------------- sesión: rejilla lectura + índice ---------------- */
.lectura{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:44px;align-items:start}
.lectura>article{min-width:0;max-width:780px}
.toc{position:sticky;top:24px;font-size:14px;display:flex;flex-direction:column;gap:14px}
.toc h4{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-left:2px solid var(--line-2)}
.toc a{display:block;padding:4px 0 4px 13px;margin-left:-2px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;line-height:1.35}
.toc a:hover{color:var(--ink)}
.toc a.activo{color:var(--acc);border-left-color:var(--acc);font-weight:600}
.toc .progreso-ses{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.toc .progreso-ses .barra{height:6px}
@media (max-width:1180px){.lectura{grid-template-columns:1fr}.toc{display:none}}

/* ---------------- contenido markdown ---------------- */
.md{font-size:17px;color:var(--ink-2)}
.md>*+*{margin-top:14px}
.md h3{margin-top:40px;scroll-margin-top:24px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.md h3:first-child{margin-top:0}
.md h4{margin-top:24px;color:var(--ink)}
.md ul,.md ol{padding-left:1.35em;margin-bottom:0}
.md li+li{margin-top:6px}
.md li::marker{color:var(--acc)}
.md blockquote{margin:16px 0 0;padding:12px 18px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2)}
.md table{border-collapse:collapse;width:100%;font-size:15px;margin-top:16px;display:block;overflow-x:auto}
.md th,.md td{border-bottom:1px solid var(--line-2);padding:8px 12px;text-align:left;vertical-align:top}
.md td:first-child code{white-space:nowrap}
.md th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.md tbody tr:hover td{background:var(--surface-2)}
/* secciones del guion con identidad propia */
.sec{scroll-margin-top:20px}
.sec+.sec,.sec+.labo,.labo+.sec{margin-top:34px}
.sec>h3{margin-top:0!important}
.sec>*+*{margin-top:12px}
.sec .ico{width:30px;height:30px;border-radius:9px;display:inline-grid;place-items:center;flex:none;background:var(--surface-3);color:var(--ink-2)}
.sec .ico svg{width:17px;height:17px}
.sec-hoy{font-size:17.5px}
.sec-hoy .ico{background:var(--acc-soft);color:var(--acc)}
.sec-idea{background:var(--surface);border:1px solid var(--acc-line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.sec-idea .ico{background:var(--acc);color:var(--surface)}
.sec-idea>p:first-of-type{font-size:19px;line-height:1.5;color:var(--ink)}
.sec-ojo{background:var(--aviso-soft);border-radius:var(--r);padding:18px 22px}
.sec-ojo .ico{background:var(--aviso);color:var(--surface)}
.sec-ojo code{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.sec-saber{background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r);padding:18px 22px}
.sec-saber .ico{background:var(--ok);color:var(--surface)}
.sec-saber ul{list-style:none;padding-left:0}
.sec-saber li{position:relative;padding-left:30px}
.sec-saber li::before{content:"";position:absolute;left:0;top:.28em;width:18px;height:18px;border-radius:5px;border:2px solid var(--ok);background:var(--surface)}
.sec-saber li::after{content:"";position:absolute;left:6px;top:.5em;width:5px;height:9px;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
/* cajas ::: */
.caja{border-radius:12px;padding:14px 18px;background:var(--surface-2);border:1px solid var(--line-2);font-size:16px}
.caja>*+*{margin-top:10px}
.caja-tit{font-family:var(--f-body);font-size:13px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.caja-tit::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.caja-aviso{background:var(--aviso-soft);border-color:transparent}.caja-aviso .caja-tit{color:var(--aviso)}
.caja-error{background:var(--mal-soft);border-color:transparent}.caja-error .caja-tit{color:var(--mal)}
.caja-clave{background:var(--acc-soft);border-color:transparent}.caja-clave .caja-tit{color:var(--acc)}
.caja-pro{background:var(--ok-soft);border-color:transparent}.caja-pro .caja-tit{color:var(--ok)}
.caja-analogia{background:var(--surface-2)}.caja-analogia .caja-tit{color:var(--b5)}

/* ---------------- bloques de código ---------------- */
.bloquecod{background:var(--code-bg);border-radius:12px;overflow:hidden;color:var(--code-ink);border:1px solid #1C2537;margin-top:16px}
.cod-cab{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;background:var(--code-bg-2);border-bottom:1px solid #1C2537;font-size:12.5px;min-height:38px;flex-wrap:wrap}
.cod-lang{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:5px;background:#1F2A3E;color:#AFC0DA}
.cod-lang[data-l="html"]{background:#3A1E14;color:#FF9B6E}.cod-lang[data-l="css"]{background:#15264A;color:#8DB4FF}
.cod-lang[data-l="js"]{background:#3A2F0B;color:#F6CE5C}.cod-lang[data-l="json"]{background:#281D48;color:#C2A8FF}
.cod-rotulo{color:#C9D4E6;font-weight:600;display:flex;align-items:center;gap:7px}
.cod-marca{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700}
.cod-mal{border-color:#5A1D24}.cod-mal .cod-cab{background:#2A1117}.cod-mal .cod-marca{background:#E5484D;color:#fff}
.cod-bien{border-color:#16432D}.cod-bien .cod-cab{background:#0E2519}.cod-bien .cod-marca{background:#30A46C;color:#fff}
.cod-acc{margin-left:auto;display:flex;gap:6px}
.cod-b{appearance:none;background:#1F2A3E;border:1px solid #2B3852;color:#C9D4E6;font-size:12px;font-weight:600;border-radius:7px;padding:3px 10px;cursor:pointer}
.cod-b:hover{background:#2A3852;color:#fff}
.cod-b.run{background:#123A28;border-color:#1F5C3F;color:#8FE3B5}
.bloquecod pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:13.8px;line-height:1.6;tab-size:2}
.bloquecod pre code{background:none;border:0;padding:0;font-size:inherit;color:inherit;white-space:pre}
.cod-salida{border-top:1px solid #1C2537;background:#070A11;font-family:var(--f-mono);font-size:13px;padding:10px 14px;display:flex;flex-direction:column;gap:3px;max-height:260px;overflow:auto}
.cod-salida .lin{white-space:pre-wrap;color:#D5DDEA}
.cod-salida .lin.error{color:#FF8A8F}.cod-salida .lin.warn{color:#F6CE5C}.cod-salida .lin.info{color:#6E7C95}
.cod-salida .lin::before{content:"› ";color:#4A5873}
.cod-vista{border-top:1px solid #1C2537;background:#fff}
.cod-vista iframe{display:block;width:100%;border:0;min-height:120px;background:#fff}
.t-kw{color:var(--t-kw)}.t-str{color:var(--t-str)}.t-num{color:var(--t-num)}.t-com{color:var(--t-com);font-style:italic}.t-fn{color:var(--t-fn)}
.t-tag{color:var(--t-tag)}.t-attr{color:var(--t-attr)}.t-prop{color:var(--t-prop)}.t-sel{color:var(--t-sel)}.t-punc{color:var(--t-punc)}.t-at{color:var(--t-kw)}.t-key{color:var(--t-prop)}

/* ---------------- títulos de parte ---------------- */
.parte{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:54px 0 16px;padding-top:24px;border-top:1px solid var(--line);scroll-margin-top:20px}
.parte h2{display:flex;align-items:center;gap:12px}
.parte .num{font-family:var(--f-mono);font-size:13px;color:var(--acc);font-weight:600}
.parte p{color:var(--muted);font-size:15px;max-width:62ch}

/* ---------------- ejercicios con carriles ---------------- */
.carriles{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--surface-2);overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-right:1px solid var(--line-2);padding:12px 18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:150px;position:relative;color:var(--ink-2)}
.tab .tl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab .tt{font-size:14.5px;font-weight:600;line-height:1.3;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--acc)}
.tab .ok{width:15px;height:15px;border-radius:50%;background:var(--ok);display:inline-grid;place-items:center;color:#fff;font-size:10px}
.ej{padding:22px 24px 8px}
.ej header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}
.ej header h3{font-size:22px;flex-basis:100%}
.ej .cuerpo{font-size:16.5px}
.acciones{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:16px 0 18px;border-top:1px solid var(--line-2);margin-top:20px}
.desplegable{margin:0 0 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);padding:14px 18px;animation:aparece .25s ease}
.desplegable .et{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--acc)}
.desplegable.pista{background:var(--aviso-soft);border-color:transparent}
.desplegable.pista .et{color:var(--aviso)}
.desplegable.sol{background:var(--ok-soft);border-color:transparent}
.desplegable.sol .et{color:var(--ok)}
.aviso-sol{font-weight:700;color:var(--ink)}
@keyframes aparece{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------------- preguntas ---------------- */
.preg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.preg+.preg{margin-top:12px}
.preg .en{font-weight:600;font-size:16.5px;color:var(--ink);display:flex;gap:10px}
.preg .en .qn{font-family:var(--f-mono);font-size:13px;color:var(--acc);padding-top:2px}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.op{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 13px;cursor:pointer;font-size:15.5px;line-height:1.4;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.op .l{font-family:var(--f-mono);font-size:12px;font-weight:600;width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;background:var(--surface-3);color:var(--muted);flex:none}
.op:hover:not(:disabled){border-color:var(--acc)}
.op:disabled{cursor:default}
.op.buena{background:var(--ok-soft);border-color:var(--ok)}.op.buena .l{background:var(--ok);color:#fff}
.op.mala{background:var(--mal-soft);border-color:var(--mal)}.op.mala .l{background:var(--mal);color:#fff}
.explic{font-size:15.5px;background:var(--surface-2);border-radius:10px;padding:12px 14px;color:var(--ink-2)}
.explic>*+*{margin-top:8px}
.diag{border-color:var(--acc-line);background:linear-gradient(var(--acc-soft),var(--surface) 60%)}

/* ---------------- pasos anterior / siguiente ---------------- */
.pasos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.paso{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.paso:hover{border-color:var(--acc)}
.paso .dir{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
.paso .tit{font-weight:600;color:var(--ink);line-height:1.3}
.paso .tit .n{font-family:var(--f-mono);font-size:12.5px;color:var(--acc);margin-right:6px}
.paso.der{text-align:right;align-items:flex-end}
.paso.vacio{visibility:hidden}
@media (max-width:600px){.pasos{grid-template-columns:1fr}.paso.der{text-align:left;align-items:flex-start}}

/* ---------------- tarjetas, listas, medidores ---------------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.grid-b{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.bcard{appearance:none;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s;color:var(--ink);position:relative;overflow:hidden}
.bcard:hover{transform:translateY(-2px);border-color:var(--acc)}
.bcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--acc)}
.bcard .top{display:flex;justify-content:space-between;align-items:center}
.bcard .bn{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--acc)}
.bcard h3{font-size:20px}
.bcard p{font-size:14.5px;color:var(--muted);line-height:1.45}
.barra{height:8px;border-radius:8px;background:var(--line-2);overflow:hidden}
.barra i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .4s}
.lista{display:flex;flex-direction:column;gap:6px}
.fila{appearance:none;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;text-align:left;color:var(--ink)}
.fila:hover{border-color:var(--acc)}
.fila .id{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--acc)}
.fila .tt{font-weight:600;line-height:1.3}
.fila .tt small{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
.fila .pr{display:flex;gap:4px;align-items:center}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.dots i.si{background:var(--acc)}
.fila.hecha{background:var(--acc-soft);border-color:transparent}
@media (max-width:560px){.fila{grid-template-columns:44px minmax(0,1fr)}.fila .pr{grid-column:2;flex-wrap:wrap}}
.bloqueh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:44px 0 14px;scroll-margin-top:20px}
.bloqueh h2{display:flex;align-items:center;gap:12px}
.bloqueh h2 .bn{font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--surface);background:var(--acc);padding:3px 9px;border-radius:8px}
.bloqueh p{color:var(--muted);font-size:15px;max-width:60ch}
.anillo{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line-2) 0);display:grid;place-items:center;flex:none}
.anillo span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600}
.medidor{display:flex;flex-direction:column;gap:8px}
.medidor h3{font-size:14px;font-family:var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cifra{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

/* ---------------- inicio ---------------- */
.portada{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px;align-items:stretch;margin-bottom:34px}
@media (max-width:900px){.portada{grid-template-columns:1fr}}
.portada .intro{display:flex;flex-direction:column;gap:14px}
.portada h1{font-size:clamp(36px,5.2vw,60px)}
.continuar{background:var(--ink);color:var(--surface);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.continuar .et{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.7}
.continuar h3{font-size:24px;color:var(--surface)}
.continuar p{opacity:.8;font-size:15px}
.continuar .b{background:var(--surface);color:var(--ink);align-self:flex-start}
.continuar .deco{position:absolute;right:-10px;bottom:-26px;font-family:var(--f-mono);font-size:120px;font-weight:600;opacity:.07;line-height:1}
.pila{display:flex;gap:6px;flex-wrap:wrap}
.pila span{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:6px;font-weight:600}

/* ---------------- referencia ---------------- */
.buscador input,.campo input,.campo textarea,.campo select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 13px;font-size:15.5px}
.campo{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.campo>span{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:650;color:var(--muted)}
.campo textarea{min-height:190px;font-family:var(--f-mono);font-size:13.5px;line-height:1.55}
.grid-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.refitem{appearance:none;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.refitem:hover{border-color:var(--acc)}
.refitem b{font-weight:600;line-height:1.3}
.refitem b .n{font-family:var(--f-mono);font-size:12.5px;color:var(--acc);margin-right:6px}
.refitem span{font-size:13px;color:var(--muted)}
.refitem .lab{color:var(--b5);font-weight:600}
.usadoen{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:14px;color:var(--muted);margin-top:10px}
.sesref{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 9px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.sesref:hover{border-color:var(--acc)}
.sesref b{font-family:var(--f-mono);font-size:12px;color:var(--acc);margin-right:4px}
.idxherm button{background:none;border:0;padding:3px 0 3px 13px;cursor:pointer;text-align:left;color:var(--muted);font-size:14px;line-height:1.35}
.idxherm button:hover{color:var(--ink)}
.idxherm button.aqui{color:var(--acc);font-weight:600}

/* ---------------- laboratorio (simuladores) ---------------- */
.labo{margin-top:30px}
.labo+.labo{margin-top:18px}
.labo-cab{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--b5)}
.labo-cab::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--b5) 30%,var(--line))}
.sim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;font-size:15.5px;color:var(--ink-2)}
.sim-h{padding:16px 20px 12px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line-2)}
.sim-h h3{font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sim-h h3 .tag{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--b5);border:1px solid currentColor;border-radius:6px;padding:1px 6px}
.sim-h p{font-size:14.5px;color:var(--muted);max-width:74ch}
.sim-b{padding:16px 20px 18px;display:flex;flex-direction:column;gap:14px}
.sim-ctrl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.sim-ctrl .lab{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sim-ctrl .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rng{display:inline-flex;align-items:center;gap:10px;font-size:14px}
.rng input[type=range]{width:min(200px,50vw);accent-color:var(--acc)}
.rng output{font-family:var(--f-mono);font-size:13px;min-width:5ch;color:var(--ink)}
.sim-msg{border-radius:10px;padding:10px 14px;font-size:15px;background:var(--surface-2);color:var(--ink-2)}
.sim-msg.ok{background:var(--ok-soft)}.sim-msg.mal{background:var(--mal-soft)}.sim-msg.av{background:var(--aviso-soft)}
.sim-msg b{color:var(--ink)}
.escena{background:var(--code-bg);border-radius:12px;color:var(--code-ink);position:relative;overflow:hidden}
.panel{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:720px){.dos{grid-template-columns:1fr}}
.editor{width:100%;min-height:120px;font-family:var(--f-mono);font-size:13.5px;line-height:1.55;background:var(--code-bg);color:var(--code-ink);border:1px solid #1C2537;border-radius:10px;padding:10px 12px;resize:vertical;tab-size:2}
.editor:focus{outline:2px solid var(--acc)}
input.txt{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;font-family:var(--f-mono);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv b{font-weight:600;color:var(--muted)}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.labcard{appearance:none;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.labcard:hover{border-color:var(--acc)}
.labcard .ses{display:flex;flex-wrap:wrap;gap:4px}
.labcard .ses span{font-family:var(--f-mono);font-size:11.5px;background:var(--acc-soft);color:var(--acc);padding:0 6px;border-radius:5px}
.labcard h3{font-size:17px}
.labcard p{font-size:14px;color:var(--muted);line-height:1.45}

/* ---------------- verificador ---------------- */
.zona{margin-top:16px;border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted);background:var(--surface)}
.zona.sobre{border-color:var(--acc);background:var(--acc-soft);color:var(--ink)}
.resultado{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.resultado header{padding:12px 16px;font-weight:650;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.chk{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.chk .m{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.chk.si .m{background:var(--ok-soft);color:var(--ok)}.chk.no .m{background:var(--mal-soft);color:var(--mal)}.chk.duda .m{background:var(--aviso-soft);color:var(--aviso)}
.chk small{display:block;color:var(--muted);font-size:13.5px}
.sello{font-size:12.5px;color:var(--muted);margin-top:26px}
#lienzo{position:absolute;left:-10000px;top:0;visibility:hidden}

/* ---------------- paleta de búsqueda ---------------- */
#paleta{position:fixed;inset:0;z-index:100;background:rgba(6,10,18,.55);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
#paleta[hidden]{display:none}
.pal{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;max-height:76vh}
.pal input{border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px;font-size:17px;outline:none}
.pal .res{overflow:auto;padding:8px}
.pal .gr{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 10px 4px}
.pal .it{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink)}
.pal .it .k{font-family:var(--f-mono);font-size:12px;color:var(--acc);font-weight:600}
.pal .it small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.pal .it.sel,.pal .it:hover{background:var(--acc-soft)}
.pal .pie{padding:8px 14px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}

/* ---------------- tostadas ---------------- */
#tostadas{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:120}
.tost{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14.5px;box-shadow:var(--shadow);animation:aparece .2s}
.tost.mal{background:var(--mal);color:#fff}

/* ================= simuladores ================= */
.sim-b .lab,.panel .lab{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}
.sim-ctrl .lab{display:inline;margin:0}
.sep{border:0;border-top:1px dashed var(--line);margin:6px 0}
.stack-r{display:flex;flex-direction:column;gap:12px;min-width:0}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:14px;max-width:100%}
.mini-cod{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:12px 14px;font-family:var(--f-mono);font-size:13px;line-height:1.6;overflow:auto;max-width:100%}
.mini-cod code{background:none;border:0;padding:0;font-size:inherit;color:inherit;white-space:pre}
.consola{background:#070A11;color:#D5DDEA;border-radius:10px;padding:10px 12px;font-size:13px;min-height:44px;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.consola .err{color:#FF8A8F}.consola .warn{color:#F6CE5C}.consola .muted{color:#6E7C95}
.rojo{color:var(--mal);font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:gira .8s linear infinite;vertical-align:-2px}
@keyframes gira{to{transform:rotate(360deg)}}
.b.sm.sec{font-weight:600}

/* peticiones */
.red{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(90px,1.3fr) minmax(0,.8fr);gap:10px;padding:14px;align-items:stretch}
.red-nodo{background:#111A2B;border:1px solid #22304A;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.red-tit{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#8FA0BA}
.barra-url{font-size:11px;background:#0A101C;border-radius:6px;padding:4px 7px;color:#AFC0DA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-pag{background:#fff;color:#111;border-radius:6px;min-height:150px;padding:8px 10px;font-family:Georgia,serif;font-size:12px;display:flex;flex-direction:column;gap:5px;transition:all .3s}
.mini-pag.vacia{background:#fff}
.mini-pag h4{margin:0;font-size:15px}.mini-pag p{margin:0}
.mini-pag.estilada{font-family:system-ui,sans-serif;background:#F4F6FA}
.mini-pag.estilada h4{color:#2760D6;font-family:system-ui}
.mini-pag .ph{height:26px;border:1px dashed #bbb;border-radius:4px;font-size:10px;color:#999;display:grid;place-items:center}
.mini-pag .ph.logo{width:60px}.mini-pag .ph.foto{height:40px}
.mini-pag .ph.logo.ok{border:0;background:linear-gradient(135deg,#2760D6,#6C42CC)}
.mini-pag .ph.foto.ok{border:0;background:linear-gradient(135deg,#F2B089,#CF4E17 60%,#6C42CC)}
.mini-pag .ph.rota{border-color:#e5484d;background:repeating-linear-gradient(45deg,#fff,#fff 4px,#fde8e8 4px,#fde8e8 8px)}
.mini-pag .ph.rota::after{content:"imagen rota";color:#be232b}
.mini-pag .datos{margin:0;padding-left:16px}
.mini-pag.error{display:grid;place-items:center;text-align:center;font-family:system-ui;color:#444;gap:6px}
.mini-pag.error small{color:#777}
.red-carril{position:relative;border-radius:10px;background:repeating-linear-gradient(90deg,transparent,transparent 10px,#16213a 10px,#16213a 11px);min-height:150px;overflow:hidden}
.paquete{position:absolute;left:4px;top:var(--y,40%);font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:6px;background:#2760D6;color:#fff;white-space:nowrap;transition-property:left,right;transition-timing-function:linear;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.paquete.ida{top:22%}.paquete.vuelta{top:62%;left:auto;right:4px;background:#15875A}
.paquete.ida.llega{left:calc(100% - 110px)}.paquete.vuelta.llega{right:calc(100% - 110px)}
.paquete.mal{background:#BE232B}.paquete.fetch{background:#6C42CC}
.srv-ico{height:70px;border-radius:8px;background:repeating-linear-gradient(0deg,#1F2A3E,#1F2A3E 14px,#16213a 14px,#16213a 18px);position:relative}
.srv-ico::after{content:"";position:absolute;right:8px;top:6px;width:7px;height:7px;border-radius:50%;background:#4CCF8E;box-shadow:0 18px 0 #4CCF8E,0 36px 0 #4CCF8E}
.srv-ico.apagado::after{background:#FF7A80;box-shadow:0 18px 0 #3a1719,0 36px 0 #3a1719}
.srv-ico.disco{background:radial-gradient(circle at 50% 50%,#8FA0BA 6px,#1F2A3E 7px,#1F2A3E 26px,#16213a 27px)}
.srv-ico.disco::after{display:none}
.srv-txt{font-size:11px;color:#8FA0BA;word-break:break-all}
.red-tabla{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px}
.rt-h,.rt-f{display:grid;grid-template-columns:1.2fr .8fr 1.1fr .7fr 2fr;gap:8px;padding:6px 12px;align-items:center;text-align:left}
.rt-h{background:var(--surface-2);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.rt-f{width:100%;border:0;border-top:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--ink)}
.rt-f:hover{background:var(--surface-2)}
.rt-f .st{font-family:var(--f-mono);font-weight:600}.rt-f .st.ok{color:var(--ok)}.rt-f .st.mal{color:var(--mal)}
.rt-f .cas{position:relative;height:10px;background:var(--line-2);border-radius:5px;overflow:hidden}
.rt-f .cas i{position:absolute;top:0;bottom:0;background:var(--acc);border-radius:5px;transition:width .4s linear}
.rt-f .cas i.mal{background:var(--mal)}
.red-det{font-size:12.5px;line-height:1.55;white-space:normal}
.red-det hr{border:0;border-top:1px solid var(--line);margin:6px 0}
@media (max-width:640px){.red{grid-template-columns:1fr 1fr}.red-carril{grid-column:1/3;grid-row:2;min-height:90px}.rt-h,.rt-f{grid-template-columns:1.3fr .8fr .9fr}.rt-h span:nth-child(n+4),.rt-f span:nth-child(n+4){display:none}}

/* url */
.url-vis{font-size:15px;line-height:2.1;word-break:break-all;padding:10px 12px;background:var(--surface-2);border-radius:10px}
.u-p{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border-bottom:3px solid var(--c);padding:3px 2px;margin-right:1px;font-weight:600}
.url-tab{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.u-f{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1.5fr);gap:12px;padding:8px 12px;border-top:1px solid var(--line-2);font-size:14px;align-items:baseline}
.u-f:first-child{border-top:0}
.u-f .mono{word-break:break-all}
.u-n{font-weight:700;color:var(--c)}
@media (max-width:640px){.u-f{grid-template-columns:1fr}}

/* rutas */
.arbol-f{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.95}
.af-i{border-radius:6px;padding-right:8px;display:flex;align-items:center;gap:6px;transition:background .2s}
.af-i.camino{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.af-i.desde{background:color-mix(in srgb,var(--b3) 22%,transparent);font-weight:700}
.af-i.hasta{background:color-mix(in srgb,var(--ok) 22%,transparent);font-weight:700}
.af-i.desde::after{content:"estoy aquí";font-family:var(--f-body);font-size:11px;color:var(--b3);margin-left:auto}
.af-i.hasta::after{content:"destino";font-family:var(--f-body);font-size:11px;color:var(--ok);margin-left:auto}
.ic-dir,.ic-file{display:inline-block;flex:none;width:15px;height:12px;border-radius:2px;background:var(--b3);position:relative;top:0}
.ic-dir::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:4px;border-radius:2px 2px 0 0;background:var(--b3)}
.ic-file{width:11px;height:14px;background:var(--surface);border:1.5px solid var(--muted)}
.ruta-res{font-size:20px;font-weight:600;margin:4px 0 8px;word-break:break-all}
.ruta-res .sube{color:var(--b3)}.ruta-res .baja{color:var(--ok)}
.pasos-r ol{margin:0;padding-left:1.2em;font-size:14.5px}

/* modelos */
.mod-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mod-t b{display:block;font-size:14.5px}.mod-t small{color:var(--muted)}
.mod-nav{background:var(--code-bg);border-radius:10px;padding:10px}
.mod-pant{background:#fff;color:#111;border-radius:6px;min-height:150px;padding:10px;font-size:13px;transition:background .15s}
.mod-pant.blanco{background:#fff}
.mp-cab{font-weight:700;color:#2760D6;margin-bottom:6px}
.mp-lista{display:flex;flex-direction:column;gap:4px;transition:opacity .2s}
.mp-lista.cargando{opacity:.35}
.mp-lista.flash{animation:flashv 1s}
@keyframes flashv{0%{background:#DFF3E6}100%{background:transparent}}
.mp-it{background:#F2F4F8;border-radius:4px;padding:4px 7px}
.mp-pie{margin-top:8px;font-size:12px;color:#666}
.mod-red{background:#070A11;color:#AFC0DA;border-radius:8px;padding:8px 10px;font-size:12px;height:96px;overflow:auto}
.mod-red .ok{color:#8FE3B5}.mod-red .muted{color:#6E7C95}

/* rest */
.pm-bar{display:flex;gap:8px;align-items:center}
.pm-bar .txt{flex:1;min-width:0}
.pm-met{font-family:var(--f-mono);font-weight:600}
.pm-st{padding:8px 12px;border-radius:9px 9px 0 0;background:var(--surface-2);font-size:14px}
.pm-st.ok{background:var(--ok-soft);color:var(--ok)}.pm-st.mal{background:var(--mal-soft);color:var(--mal)}
.pm-resp .mini-cod{border-radius:0 0 10px 10px;min-height:120px;max-height:260px}
.pm-crudo{font-size:12.5px;white-space:pre-wrap;margin:8px 0 0}

/* token */
.seq{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seq-h{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.seq-h span{padding:8px 14px}.seq-h span+span{text-align:right}
.seq-b{max-height:280px;min-height:120px;overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(90deg,transparent calc(50% - 1px),var(--line) calc(50% - 1px),var(--line) calc(50% + 1px),transparent calc(50% + 1px))}
.seq-f{display:flex;animation:aparece .3s}
.seq-f.ida{justify-content:flex-start}.seq-f.vuelta{justify-content:flex-end}.seq-f.cli{justify-content:flex-start}
.seq-m{max-width:62%;font-size:12.5px;padding:7px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);position:relative;word-break:break-all}
.seq-f.ida .seq-m{border-color:var(--acc);background:var(--acc-soft)}
.seq-f.ida .seq-m::after{content:"→";position:absolute;right:-18px;top:6px;color:var(--acc);font-weight:700}
.seq-f.vuelta .seq-m::before{content:"←";position:absolute;left:-18px;top:6px;font-weight:700}
.seq-f.vuelta.ok .seq-m{background:var(--ok-soft);border-color:var(--ok)}.seq-f.vuelta.mal .seq-m{background:var(--mal-soft);border-color:var(--mal)}
.seq-f.cli .seq-m{border-style:dashed;background:var(--surface-2);color:var(--muted)}
.tok-str{font-size:12.5px;word-break:break-all;margin:4px 0}
.tok-str .th{color:#E5484D}.tok-str .tp{color:var(--b5)}.tok-str .ts{color:var(--b0)}

/* anatomía */
.ana-cod{font-size:clamp(16px,2.6vw,24px);background:var(--code-bg);color:var(--code-ink);padding:18px 16px;border-radius:12px;overflow-x:auto;white-space:nowrap}
.ana-cod span{border-radius:4px;transition:background .2s,color .2s;padding:2px 0}
.ana-cod span.on{background:#F6CE5C;color:#1a1400}
.ana-cajas{font-size:15px;padding:10px;background:var(--surface-2);border-radius:10px;display:flex;flex-direction:column;gap:6px;position:relative}
.caja-n{border:2px solid var(--b2);border-radius:8px;padding:18px 10px 8px;position:relative;background:var(--surface)}
.caja-n .et{position:absolute;top:-1px;left:8px;font-family:var(--f-mono);font-size:11px;color:var(--surface);background:var(--b2);padding:0 6px;border-radius:0 0 5px 5px}
.caja-n.s{border-color:var(--b1);display:inline-block;padding:14px 8px 4px;margin:0 4px}
.caja-n.s .et{background:var(--b1)}
.caja-n.solapa{border-bottom-style:dashed}
.caja-n.cruza{border-color:var(--mal);border-bottom:0;border-radius:8px 8px 0 0}
.caja-n.cruza2{border:2px solid var(--mal);border-top:0;border-radius:0 0 8px 8px;margin-left:120px;padding:4px 10px 16px;background:var(--mal-soft)}
.caja-n.cruza2 .et{top:auto;bottom:-1px;border-radius:5px 5px 0 0;background:var(--mal)}

/* árbol */
.arbol{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;max-height:390px;overflow:auto}
.arbol ul{list-style:none;margin:0;padding-left:16px;border-left:1px dashed var(--line)}
.arbol .an-raiz{border:0;padding-left:0}
.arbol li{padding:1px 0}
.an-e{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line-2)}
.arbol li.hit>.an-e{background:#F6CE5C;border-color:#C99A00;color:#1a1400}
.arbol li.hit>.an-e .t-tag,.arbol li.hit>.an-e .t-attr,.arbol li.hit>.an-e .t-str{color:#1a1400}
.an-n{font-size:10.5px;background:#1a1400;color:#F6CE5C;border-radius:4px;padding:0 4px;margin-left:5px}
.an-t{color:var(--muted);font-style:italic}
.arbol .t-tag{color:var(--b1)}.arbol .t-attr{color:var(--b3)}.arbol .t-str{color:var(--ok)}

/* semántica */
.sem-pag{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);padding:10px;border-radius:12px;font-size:14px}
.sz{border:2px dashed var(--line);border-radius:8px;padding:18px 10px 8px;position:relative;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.sz:hover{border-color:var(--acc)}
.sz.on{border-style:solid;border-color:var(--acc);background:var(--acc-soft)}
.sz .et{position:absolute;top:2px;left:8px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.sz-fila{display:grid;grid-template-columns:2fr 1fr;gap:6px}
.sz .sz{margin-top:6px}
.sem-l{margin:0;padding-left:1.3em;font-size:14.5px}
.sem-l li.on{color:var(--acc);font-weight:600}
.sem-vacio{font-size:14.5px;color:var(--mal)}

/* formulario */
.form-demo{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-radius:12px;padding:14px}
.fd{display:flex;flex-direction:column;gap:4px;font-size:14.5px;border:0;padding:0;margin:0}
.fd legend{font-weight:600;padding:0;margin-bottom:4px}
.fd>label:first-child{font-weight:600}
.fd input:not([type=checkbox]):not([type=radio]),.fd select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)}
.fd input:invalid:not(:placeholder-shown){border-color:var(--mal)}
.form-demo .b{align-self:flex-start}
.fd-envio{margin:0;font-size:12.5px;white-space:pre-wrap;word-break:break-all}
.fd-val{display:flex;flex-direction:column;gap:4px}
.fd-v{font-size:13.5px;padding:5px 10px;border-radius:8px}
.fd-v.ok{background:var(--ok-soft)}.fd-v.mal{background:var(--mal-soft)}

/* json */
.js-ed{display:grid;grid-template-columns:34px 1fr;background:var(--code-bg);border-radius:10px;overflow:hidden}
.js-ed .editor{border:0;border-radius:0;min-height:290px}
.js-num{color:#4A5873;font-size:13.5px;line-height:1.55;padding:10px 6px;text-align:right;overflow:hidden;user-select:none}
.js-num .err{color:#fff;background:#BE232B;border-radius:3px}
.json-arbol{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;max-height:310px;overflow:auto}
.json-arbol ul{list-style:none;margin:0;padding-left:14px;border-left:1px dashed var(--line)}
.json-arbol>ul{border:0;padding-left:0}
.json-arbol .jt{font-size:10.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;margin-left:4px}
.json-arbol .t-key{color:var(--b2)}.json-arbol .t-str{color:var(--ok)}.json-arbol .t-num{color:var(--b1)}.json-arbol .t-kw{color:var(--b5)}

/* selectores */
.sel-demo{background:var(--surface-2);border-radius:12px;padding:10px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.sel-demo *{border-radius:6px}
.sel-demo header,.sel-demo nav,.sel-demo main,.sel-demo article,.sel-demo aside,.sel-demo footer,.sel-demo ul{border:1px dashed var(--line);padding:6px 8px;background:var(--surface);display:flex;flex-direction:column;gap:4px;margin:0}
.sel-demo ul{flex-direction:row;flex-wrap:wrap;list-style:none}
.sel-demo li{padding:2px 4px}
.sel-demo h1,.sel-demo h2{font-size:15px;margin:0;font-family:var(--f-body)}
.sel-demo p{margin:0}
.sel-demo a{color:var(--b2)}
.sel-demo a.activo{font-weight:700}
.sel-demo [data-t]{position:relative}
.sel-demo .hit{outline:3px solid #F6CE5C;outline-offset:1px;background:color-mix(in srgb,#F6CE5C 25%,var(--surface))!important}

/* especificidad */
.esp-reglas{display:flex;flex-direction:column;gap:6px;min-width:0}
.esp-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:6px 8px;font-family:var(--f-mono);font-size:13px;transition:opacity .2s}
.esp-r.noafecta{opacity:.5}
.esp-r .esp-s{width:170px;flex:0 1 170px;padding:4px 7px;font-size:13px}
.esp-r .sel{font-family:var(--f-mono);font-size:12.5px;padding:3px 5px}
.esp-imp{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--aviso)}
.esp-b{margin-left:auto;color:var(--muted)}
.esp-prev{background:var(--surface-2);border-radius:12px;padding:18px;font-size:22px;font-weight:600;font-family:var(--f-display)}
.esp-prev p{margin:0;transition:color .3s}
.esp-rank ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:5px;font-size:14px}
.esp-rank li.gana{font-weight:600}
.esp-rank .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* caja */
.bm{display:flex;justify-content:center;padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:11.5px}
.bm-m{background:#F9CC9D;position:relative;transition:padding .2s}
.bm-b{background:#FDDD9B;border:0 solid #1F2937;position:relative;transition:border-width .2s}
.bm-p{background:#C3D08B;position:relative;transition:padding .2s}
.bm-c{background:#8CB6C0;height:60px;display:grid;place-items:center;white-space:nowrap;font-size:11px;color:#10202a;transition:width .2s;min-width:10px}
.bm span{position:absolute;top:1px;left:4px;color:#3a2a10;font-size:10.5px}
.bm-b>span{top:-1px;color:#6a4a00}
:root[data-theme="dark"] .bm-b{border-color:#E7ECF4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bm-b{border-color:#E7ECF4}}
.fus{background:var(--surface-2);border-radius:10px;padding:12px;max-width:380px}
.fus-a,.fus-b{background:var(--b2);color:#fff;border-radius:6px;padding:10px 12px;font-size:14px}
.fus-g{position:relative;transition:height .2s;background:repeating-linear-gradient(45deg,transparent,transparent 4px,color-mix(in srgb,var(--b1) 25%,transparent) 4px,color-mix(in srgb,var(--b1) 25%,transparent) 8px)}
.fus-g span{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}

/* contraste */
.con-prev{border-radius:12px;padding:18px 20px;border:1px solid var(--line-2)}
.con-prev .n{font-size:16px;margin:0 0 6px}.con-prev .g{font-size:24px;font-weight:600;margin:0}
.con-res{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.con-r{font-size:34px;font-weight:600;color:var(--ink)}.con-r small{font-size:16px;color:var(--muted)}
.con-bs{display:flex;gap:6px;flex-wrap:wrap}
.con-b{font-size:13px;font-weight:650;padding:3px 10px;border-radius:999px}
.con-b.ok{background:var(--ok-soft);color:var(--ok)}.con-b.mal{background:var(--mal-soft);color:var(--mal)}

/* unidades */
.uni{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.uni-c{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.uni-t{color:var(--ink);font-weight:600;line-height:1.25;transition:font-size .2s}
.uni-t .h{padding-left:10px;border-left:2px solid var(--acc)}
.uni-c small{font-family:var(--f-mono);color:var(--muted)}
@media (max-width:640px){.uni{grid-template-columns:1fr}}

/* posición */
.pos-marco{transform:translateZ(0);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:280px;background:var(--surface-2)}
.pos-scroll{height:100%;overflow:auto;padding:12px 16px}
.pos-p{margin:0 0 10px;color:var(--muted);font-size:14px}
.pos-card{background:var(--surface);border:2px solid var(--b2);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.pos-card p{margin:6px 0}
.pos-badge{display:inline-block;background:var(--b1);color:#fff;font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;z-index:2;transition:top .2s,left .2s}

/* flexbox */
.fx-dos{align-items:start}
.fx-wrap{position:relative}
.fx{display:flex;min-height:230px;background:var(--surface-2);border:2px dashed var(--acc-line);border-radius:12px;padding:10px;transition:all .25s}
.fx-i{background:var(--b2);color:#fff;border-radius:8px;padding:8px 12px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:all .25s}
.fx-i:nth-child(3n+2){background:var(--b5)}.fx-i:nth-child(3n){background:var(--b4)}
.fx-eje{position:absolute;pointer-events:none;background:var(--b1);opacity:.8}
.fx-eje::after{content:"";position:absolute;border:7px solid transparent}
.fx-eje.row,.fx-eje.row-reverse{left:14px;right:14px;bottom:4px;height:2px}
.fx-eje.row::after{right:-4px;top:-6px;border-left-color:var(--b1)}.fx-eje.row-reverse::after{left:-4px;top:-6px;border-right-color:var(--b1)}
.fx-eje.column,.fx-eje.column-reverse{top:14px;bottom:14px;right:4px;width:2px}
.fx-eje.column::after{bottom:-4px;left:-6px;border-top-color:var(--b1)}.fx-eje.column-reverse::after{top:-4px;left:-6px;border-bottom-color:var(--b1)}

/* grid */
.gr-wrap{background:var(--surface-2);border-radius:12px;padding:10px}
.gr{display:grid;transition:width .2s;margin:0 auto;outline:1px dashed var(--acc-line);min-height:120px}
.gr-i{background:var(--b2);color:#fff;border-radius:8px;padding:14px;font-weight:700;display:grid;place-items:center;min-height:56px;font-family:var(--f-mono)}
.gr-i:nth-child(2n){background:var(--b5)}
.gr-i.area{min-height:60px;background:var(--b4)}
.gr-i.area:nth-child(3){min-height:120px;background:var(--b2)}

/* responsive */
.rs-dos{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.rs-dos{grid-template-columns:1fr}}
.rs-marco{background:var(--surface-3);border-radius:12px;padding:10px;min-width:0;overflow:hidden}
.rs-disp{margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 0 0 6px #1b2233,0 10px 30px -10px rgba(0,0,0,.5);background:#fff;transition:width .2s}
.rs-disp iframe{border:0;display:block;transform-origin:0 0;background:#fff}
.rs-code .rs-b{opacity:.35;transition:opacity .2s;display:inline}
.rs-code .rs-b.on{opacity:1}

/* carga de script */
.cs-dos{align-items:start}
.cs-lanes{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:10px;padding:10px}
.cs-l{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.cs-t{position:relative;height:22px;background:var(--surface);border-radius:6px;overflow:hidden}
.cs-t i{position:absolute;top:0;bottom:0;font-style:normal;font-size:10.5px;display:grid;place-items:center;color:#fff;overflow:hidden;white-space:nowrap}
.cs-p{background:var(--b1)}.cs-pausa{background:repeating-linear-gradient(45deg,var(--line),var(--line) 4px,transparent 4px,transparent 8px);color:var(--muted)!important}
.cs-d{background:var(--b2)}.cs-e{background:var(--ok)}.cs-e.mal{background:var(--mal)}
.cs-blanco{background:var(--surface-3);color:var(--muted)!important}.cs-vis{background:var(--b4)}
.cs-cursor{position:absolute;top:6px;bottom:6px;width:2px;background:var(--ink);left:130px;pointer-events:none}

/* igualdad */
.ig-res{display:flex;flex-wrap:wrap;gap:10px}
.ig-c{background:var(--surface-2);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;min-width:110px}
.ig-c b{font-family:var(--f-mono);font-size:22px}.ig-c b.si{color:var(--ok)}.ig-c b.no{color:var(--mal)}
.ig-tab-w{overflow-x:auto}
.ig-tab{border-collapse:collapse;font-size:12px}
.ig-tab th{font-weight:600;color:var(--muted);padding:3px 6px;white-space:nowrap}
.ig-tab td{width:30px;height:26px;text-align:center;border:1px solid var(--line-2);cursor:pointer;color:var(--ok);font-weight:700}
.ig-tab td.si{background:var(--ok-soft)}.ig-tab td.sel{outline:2px solid var(--acc);outline-offset:-2px}

/* métodos de array */
.ma-arr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ma-it{background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:6px 9px;display:flex;flex-direction:column;font-size:12.5px;min-width:84px;transition:all .25s}
.ma-it b{font-size:13.5px}.ma-it small{color:var(--muted)}
.ma-it.cur{border-color:var(--acc);background:var(--acc-soft);transform:translateY(-3px);box-shadow:var(--shadow)}
.ma-it.visto{opacity:.55}.ma-it.salta{opacity:.3;border-style:dashed}
.ma-it.nuevo{background:var(--ok-soft);border-color:transparent;animation:aparece .3s}
.ma-cb{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:8px 10px;font-size:12.5px;min-height:36px;margin-bottom:10px}
.ma-acc{font-size:18px}.ma-out code.big{font-size:18px}

/* memoria */
.mem{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:12px}
@media (max-width:640px){.mem{grid-template-columns:1fr}}
.mem-v>div,.mem-h>div{display:flex;flex-direction:column;gap:6px}
.mem-var{background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:14px}
.mem-ref{font-family:var(--f-mono);font-size:12px;font-weight:700;background:var(--c);color:#fff;border-radius:5px;padding:1px 6px}
.mem-o{border:2px solid var(--c);border-radius:10px;padding:7px 10px;display:flex;gap:8px;align-items:center;font-size:13px;background:var(--surface)}
.mem-o.flash{animation:flashv 1.2s}
.mem-id{font-family:var(--f-mono);font-weight:700;color:var(--c)}
.mem-log{font-size:12px;color:var(--muted);margin-top:6px}

/* almacenamiento */
.al-ops{display:flex;flex-direction:column;gap:5px}
.al-op{text-align:left;background:var(--code-bg);color:var(--code-ink);border:1px solid #1C2537;border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer;overflow-x:auto;white-space:nowrap}
.al-op:hover{border-color:var(--acc)}
.al-t{border-collapse:collapse;width:100%;font-size:13px}
.al-t th,.al-t td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line-2);word-break:break-all}
.al-t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* xss */
.xss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.xss{grid-template-columns:1fr}}
.xss-c{background:var(--surface-2);border:2px solid transparent;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.xss-c.mal{border-color:var(--mal);background:var(--mal-soft)}
.xss-c .lab{font-family:var(--f-mono);text-transform:none;letter-spacing:0;font-size:11.5px}
.xss-r{background:var(--surface);border-radius:8px;padding:10px;min-height:44px;word-break:break-all;color:var(--ink)}
.xss-e{font-size:13.5px}

/* atributo/propiedad */
.ap-demo{display:flex;flex-direction:column;gap:6px}
.ap-li{margin:10px 0 0;padding-left:18px;font-size:14px}
.ap-t .kv{font-size:13px}

/* eventos */
.ev-demo section,.ev-demo ul,.ev-demo li,.ev-demo button{transition:box-shadow .2s,background .2s}
.ev-demo section{border:2px solid var(--b0);border-radius:12px;padding:24px 12px 12px;position:relative;background:var(--surface-2)}
.ev-demo ul{list-style:none;margin:0;padding:24px 10px 10px;border:2px solid var(--b2);border-radius:10px;position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.ev-demo li{border:2px solid var(--b5);border-radius:8px;padding:6px 8px 6px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.ev-demo li.hecha span{text-decoration:line-through;color:var(--muted)}
.ev-demo li.fuera{opacity:0;transform:translateX(20px);transition:all .3s}
.ev-demo button.ev-bor{border:0;background:var(--b1);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12.5px;font-weight:600}
.ev-et{position:absolute;top:3px;left:10px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ev-demo .on{box-shadow:0 0 0 4px #F6CE5C;background:color-mix(in srgb,#F6CE5C 22%,var(--surface))}
.ev-log div{font-size:12.5px}
.ev-f{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:4px;margin-right:4px;font-weight:700}
.ev-f.captura{background:#2B3A5C;color:#9DB8FF}.ev-f.objetivo{background:#4A3A0B;color:#F6CE5C}.ev-f.burbuja{background:#13402B;color:#8FE3B5}

/* bucle de eventos */
.el-vis{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr));grid-template-areas:"code pila apis" "code micro tasks" "cons cons cons";gap:10px}
.el-code{grid-area:code;min-width:0}.el-vis .el-col:nth-of-type(2){grid-area:pila}.el-vis .el-col:nth-of-type(3){grid-area:apis}.el-vis .el-col:nth-of-type(4){grid-area:micro}.el-vis .el-col:nth-of-type(5){grid-area:tasks}.el-cons{grid-area:cons}
@media (max-width:760px){.el-vis{grid-template-columns:1fr 1fr;grid-template-areas:"code code" "pila apis" "micro tasks" "cons cons"}}
.el-col{background:var(--surface-2);border-radius:10px;padding:8px;min-height:100px;display:flex;flex-direction:column;min-width:0}
.el-stack,.el-apis,.el-micro,.el-tasks{display:flex;flex-direction:column;gap:5px;flex:1}
.el-stack{justify-content:flex-end}
.el-it{font-family:var(--f-mono);font-size:11.5px;padding:5px 8px;border-radius:7px;animation:aparece .25s;word-break:break-all}
.el-it.pila{background:var(--b2);color:#fff}.el-it.pila.top{box-shadow:0 0 0 2px #F6CE5C}
.el-it.api{background:var(--aviso-soft);color:var(--aviso)}.el-it.mic{background:color-mix(in srgb,var(--b5) 18%,var(--surface));color:var(--b5)}.el-it.tar{background:var(--ok-soft);color:var(--ok)}
.el-vac{font-size:12px;color:var(--muted);font-style:italic;margin:auto 0}
.el-l{display:inline-block;width:100%;border-radius:4px;transition:background .2s}
.el-l.on{background:rgba(246,206,92,.22);box-shadow:inset 3px 0 #F6CE5C}
.el-l.hecho{}.el-l.saltada{opacity:.35;text-decoration:line-through}

/* promesas */
.pr-pasos{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.pr-p{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;font-size:13px}
.pr-p code{font-size:12px}
.pr-st{font-size:12px;font-weight:700;color:var(--muted)}
.pr-v{grid-column:1/3;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pr-p.run{border-color:var(--acc)}.pr-p.ok{background:var(--ok-soft);border-color:transparent}.pr-p.ok .pr-st{color:var(--ok)}
.pr-p.rej{background:var(--mal-soft);border-color:transparent}.pr-p.rej .pr-st{color:var(--mal)}.pr-p.skip{opacity:.4}
.pr-ui{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14.5px;min-height:44px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pa{display:flex;flex-direction:column;gap:10px}
.pa-f{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:start;font-size:13.5px}
.pa-t{position:relative;min-height:66px;background:var(--surface-2);border-radius:8px}
.pa-f:first-child .pa-t{min-height:22px}
.pa-t i{position:absolute;height:20px;top:0;background:var(--b5);color:#fff;font-style:normal;font-size:11px;border-radius:5px;display:grid;place-items:center;overflow:hidden;transition:width .9s linear;white-space:nowrap}
.pa-t i:nth-child(2){background:var(--b2)}.pa-t i:nth-child(3){background:var(--b4)}

/* fetch */
.fe-red{background:#070A11;color:#AFC0DA;border-radius:10px;padding:8px 10px;font-size:12.5px;min-height:70px;margin-bottom:10px}
.fe-red .ok{color:#8FE3B5}.fe-red .mal{color:#FF8A8F}
.fe-ui{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:90px;font-size:14.5px}
.fe-ui ul{margin:0;padding-left:1.2em}
.fe-ui.error{border-color:var(--mal);background:var(--mal-soft)}.fe-ui.vacio{background:var(--aviso-soft);border-color:transparent}.fe-ui.datos{border-color:var(--ok)}

/* mvc */
.mvc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:720px){.mvc{grid-template-columns:1fr}}
.mvc-app{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mvc-form{display:flex;gap:8px}.mvc-form .txt{font-family:var(--f-body)}
.mvc-fil{display:flex;gap:6px;flex-wrap:wrap}
.mvc-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.mvc-lista li{background:var(--surface);border-radius:8px;padding:7px 10px;font-size:14.5px}
.mvc-lista li.hecha label{text-decoration:line-through;color:var(--muted)}
.mvc-dia{position:relative;display:flex;flex-direction:column;gap:14px;padding:6px 0 6px 0}
.mvc-b{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);transition:all .2s;margin-left:0;margin-right:110px}
.mvc-b b{display:block}.mvc-b small{color:var(--muted)}
.mvc-b.v{border-color:var(--b2)}.mvc-b.c{border-color:var(--b5)}.mvc-b.m{border-color:var(--b4)}
.mvc-b.on{box-shadow:0 0 0 4px #F6CE5C;transform:translateX(4px)}
.mvc-tok{position:absolute;right:0;width:106px;font-family:var(--f-mono);font-size:10.5px;background:#1a1400;color:#F6CE5C;border-radius:7px;padding:4px 6px;opacity:0;transition:top .4s,opacity .2s;word-break:break-all}
.mvc-tok.vis{opacity:1}

/* estados */
.es-pant{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.es-bus{display:flex;gap:8px}
.es-cuerpo{background:var(--surface);border-radius:10px;padding:14px;min-height:150px;font-size:14.5px}
.es-ini{color:var(--muted);text-align:center;padding-top:30px}
.es-sk{height:18px;border-radius:6px;margin-bottom:10px;background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:sk 1.2s infinite}
.es-sk.corto{width:60%}
@keyframes sk{to{background-position:-200% 0}}
.es-vac{background:var(--aviso-soft);border-radius:8px;padding:12px}
.es-err{background:var(--mal-soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.es-l{margin:0;padding-left:1.2em}
.es-check h4{margin:4px 0}
.es-ok{margin:8px 0 0;padding-left:1.2em;font-size:14px}

/* enrutador */
.rt-nav{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rt-bar{display:flex;gap:6px;align-items:center;background:var(--surface-3);padding:6px 8px}
.rtr-b{border:0;background:var(--surface);border-radius:6px;width:30px;height:28px;cursor:pointer;font-size:15px}
.rtr-b:disabled{opacity:.35;cursor:default}
.rt-url{flex:1;min-width:0;background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-url b{color:var(--acc)}
.rt-app{display:grid;grid-template-columns:140px 1fr;min-height:190px}
@media (max-width:560px){.rt-app{grid-template-columns:1fr}}
.rt-menu{display:flex;flex-direction:column;gap:2px;padding:10px;background:var(--surface-2);border-right:1px solid var(--line-2)}
.rt-menu a{padding:5px 8px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:14px}
.rt-menu a:hover{background:var(--surface)}
.rt-vista{padding:12px 16px;font-size:14.5px}
.rt-vista h4{margin:0 0 6px}.rt-vista ul{margin:6px 0 0;padding-left:1.2em}
.rt-bus{max-width:260px}
.rt-tabla,.rt-hist{font-size:12.5px;display:flex;flex-direction:column;gap:3px;white-space:pre}
.rt-tabla div,.rt-hist div{padding:3px 8px;border-radius:6px}
.rt-tabla .on,.rt-hist .on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.consola:empty{display:none}
</style>
</head>

<script>
/* ============================================================
