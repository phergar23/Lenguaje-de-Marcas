  for (const l of lineas) {
    if (/^@K\s/.test(l)) {
      const [id, tema, titulo] = l.slice(3).trim().split('|');
      act = { id, tema, titulo, cuerpo: [] };
      res.push(act);
    } else if (act) act.cuerpo.push(l);
  }
  return res.map(c => ({ ...c, cuerpo: c.cuerpo.join('\n').trim() }));
}

/* ---------- Renderizador de texto ---------- */

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function linea(t) {
  let s = esc(t);
  const codigos = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => {
    codigos.push(c);
    return '\u0000' + (codigos.length - 1) + '\u0000';
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(ref:([a-z0-9-]+)\)/g,
    (m, txt, id) => `<button class="ref" data-ref="${id}">${txt}</button>`);
  // Forma compacta: [[ficha]] o [[ficha|texto a mostrar]]
  s = s.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, txt) => {
    const c = APP.refId[id];
    if (!c) return `<span class="ref-rota" title="Ficha inexistente: ${id}">${txt || id}</span>`;
    return `<button class="ref" data-ref="${id}">${txt || esc(c.titulo)}</button>`;
  });
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codigos[+i] + '</code>');
  return s;
}

function anclaDe(txt) {
  return 'sec-' + String(txt)
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/`|\*/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '')
    .slice(0, 50);
}

/* Devuelve los apartados de nivel ## de un cuerpo, para el indice lateral. */
function indiceDe(cuerpo) {
  const salida = [];
  let dentroDeCodigo = false;
  for (const l of String(cuerpo || '').split('\n')) {
    if (/^```/.test(l)) { dentroDeCodigo = !dentroDeCodigo; continue; }
    if (dentroDeCodigo) continue;
    if (/^##\s/.test(l) && !/^###/.test(l)) {
      const txt = l.slice(3).trim();
      salida.push({ id: anclaDe(txt), txt: txt.replace(/`/g, '') });
    }
  }
  return salida;
}

function md(txt) {
  if (!txt) return '';
  const ls = txt.split('\n');
  let out = '', i = 0;

  const cierra = (buf, tag) => buf.length ? `<${tag}>${buf.join('')}</${tag}>` : '';

  while (i < ls.length) {
    const l = ls[i];

    if (/^```/.test(l)) {
      // ```lenguaje|estado|Titulo   (estado: mal | bien | neutro)
      const cab = l.slice(3).trim().split('|');
      if ((cab[0] || '').trim() === 'figura') {
        i++; while (i < ls.length && !/^```/.test(ls[i])) i++; i++;
        out += figura((cab[1] || '').trim(), (cab[2] || '').trim()); continue;
      }
      if ((cab[0] || '').trim() === 'controles') {
        const cuerpo = []; i++;
        while (i < ls.length && !/^```/.test(ls[i])) { cuerpo.push(ls[i]); i++; }
        i++; out += bloqueControles(cuerpo); continue;
      }
      const estado = (cab[1] || '').trim();
      const rotulo = (cab[2] || '').trim();
      const cuerpo = [];
      i++;
      while (i < ls.length && !/^```/.test(ls[i])) { cuerpo.push(ls[i]); i++; }
      i++;
      out += bloqueCodigo((cab[0] || '').trim(), estado, rotulo, cuerpo.join('\n'));
      continue;
    }
    if (/^####\s/.test(l)) { out += '<h4>' + linea(l.slice(5)) + '</h4>'; i++; continue; }
    if (/^###\s/.test(l)) { out += '<h4>' + linea(l.slice(4)) + '</h4>'; i++; continue; }
    if (/^##\s/.test(l)) {
      const txt = l.slice(3);
      out += '<h3 id="' + anclaDe(txt) + '">' + linea(txt) + '</h3>';
      i++; continue;
    }
    if (/^\|/.test(l)) {
      const filas = [];
      while (i < ls.length && /^\|/.test(ls[i])) {
        const celdas = ls[i].replace(/^\|/, '').replace(/\|$/, '').split('|');
        if (!celdas.every(c => /^[-: ]*$/.test(c))) filas.push(celdas);
        i++;
      }
      if (filas.length) {
        out += '<table><thead><tr>' + filas[0].map(c => '<th>' + linea(c.trim()) + '</th>').join('') +
          '</tr></thead><tbody>' +
          filas.slice(1).map(f => '<tr>' + f.map(c => '<td>' + linea(c.trim()) + '</td>').join('') + '</tr>').join('') +
          '</tbody></table>';
      }
      continue;
    }
    if (/^:::/.test(l)) {
      const cab = l.slice(3).trim();
      const esp = cab.indexOf(' ');
      const tipo = (esp === -1 ? cab : cab.slice(0, esp)).toLowerCase() || 'nota';
      const titulo = esp === -1 ? '' : cab.slice(esp + 1).trim();
      const cuerpo = [];
      i++;
      while (i < ls.length && !/^:::\s*$/.test(ls[i])) { cuerpo.push(ls[i]); i++; }
      i++;
      const tipos = ['aviso', 'error', 'clave', 'analogia', 'pro', 'nota'];
      const cl = tipos.includes(tipo) ? tipo : 'nota';
      out += '<aside class="caja caja-' + cl + '">' +
        (titulo ? '<h5 class="caja-tit">' + linea(titulo) + '</h5>' : '') +
        md(cuerpo.join('\n')) + '</aside>';
      continue;
    }
    if (/^>\s?/.test(l)) {
      const buf = [];
      while (i < ls.length && /^>\s?/.test(ls[i])) { buf.push(ls[i].replace(/^>\s?/, '')); i++; }
      out += '<blockquote>' + md(buf.join('\n')) + '</blockquote>';
      continue;
    }
    if (/^[-*]\s/.test(l)) {
      const buf = [];
      while (i < ls.length && (/^[-*]\s/.test(ls[i]) || (/^\s{2,}\S/.test(ls[i]) && buf.length))) {
        if (/^[-*]\s/.test(ls[i])) buf.push('<li>' + linea(ls[i].slice(2)));
        else buf[buf.length - 1] += ' ' + linea(ls[i].trim());
        i++;
      }
      out += cierra(buf.map(x => x + '</li>'), 'ul');
      continue;
    }
    if (/^\d+\.\s/.test(l)) {
      const buf = [];
      while (i < ls.length && (/^\d+\.\s/.test(ls[i]) || (/^\s{3,}\S/.test(ls[i]) && buf.length))) {
        if (/^\d+\.\s/.test(ls[i])) buf.push('<li>' + linea(ls[i].replace(/^\d+\.\s/, '')));
        else buf[buf.length - 1] += ' ' + linea(ls[i].trim());
        i++;
      }
      out += cierra(buf.map(x => x + '</li>'), 'ol');
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < ls.length && ls[i].trim() && !/^(```|#{2,4}\s|\||>|[-*]\s|\d+\.\s)/.test(ls[i])) {
      buf.push(ls[i].trim()); i++;
    }
    out += '<p>' + linea(buf.join(' ')) + '</p>';
  }
  return out;
}

/* ---------- Almacenamiento en tres capas ---------- */

const CLAVE = 'lm.dam.v1';
const CLAVE_NUBE = 'lm-dam-progreso';

function molde() {
  return { v: 2, alumno: '', ej: {}, q: {}, ts: 0 };
}

function sanea(x) {
  const m = molde();
  if (!x || typeof x !== 'object') return m;
  // v2 (versión 7 del curso): se insertó una sesión nueva tras la S07, así que S08…S59 pasan a S09…S60
  if (x.v !== 2) {
    const mueve = obj => { if (!obj || typeof obj !== 'object') return obj; const n = {}; for (const k of Object.keys(obj)) { const k2 = k.replace(/^S(\d{2})(?=\D|$)/, (a, d) => +d >= 8 ? 'S' + String(+d + 1).padStart(2, '0') : a); n[k2] = obj[k]; } return n; };
    x = Object.assign({}, x, { ej: mueve(x.ej), q: mueve(x.q) });
  }
  m.alumno = typeof x.alumno === 'string' ? x.alumno.slice(0, 60) : '';
  m.ts = typeof x.ts === 'number' ? x.ts : 0;
  if (x.ej && typeof x.ej === 'object') {
    for (const k of Object.keys(x.ej).slice(0, 4000)) {
      const e = x.ej[k];
      if (!e || typeof e !== 'object') continue;
      m.ej[k] = { h: !!e.h, sol: !!e.sol, t: typeof e.t === 'number' ? e.t : 0 };
    }
  }
  if (x.q && typeof x.q === 'object') {
    for (const k of Object.keys(x.q).slice(0, 4000)) {
      const q = x.q[k];
      if (!q || typeof q !== 'object') continue;
      m.q[k] = { ok: !!q.ok, op: typeof q.op === 'number' ? q.op : -1 };
    }
  }
  return m;
}

function guardaLocal() {
  APP.estado.ts = Date.now();
  try {
    const prev = localStorage.getItem(CLAVE);
    if (prev) localStorage.setItem(CLAVE + '.prev', prev);
    localStorage.setItem(CLAVE, JSON.stringify(APP.estado));
  } catch (e) {
    tosta('No se ha podido guardar en este navegador. Exporta tu progreso.', true);
  }
}

async function guardaNube() {
  if (!window.storage || !window.storage.set) return;
  for (let i = 0; i < 3; i++) {
    try {
      await window.storage.set(CLAVE_NUBE, JSON.stringify(APP.estado), false);
      return true;
    } catch (e) {
      await new Promise(r => setTimeout(r, 400 * Math.pow(2, i)));
    }
  }
  return false;
}

let temporizadorNube = null;
function guarda() {
  guardaLocal();
  clearTimeout(temporizadorNube);
  temporizadorNube = setTimeout(() => { guardaNube(); }, 1500);
}

async function carga() {
  let local = null;
  try { local = JSON.parse(localStorage.getItem(CLAVE) || 'null'); } catch (e) { }
  let nube = null;
  if (window.storage && window.storage.get) {
    try {
      const r = await window.storage.get(CLAVE_NUBE, false);
      if (r && r.value) nube = JSON.parse(r.value);
    } catch (e) { }
  }
  const a = sanea(local), b = sanea(nube);
  APP.estado = (b.ts > a.ts) ? b : a;
}

function tosta(txt, mal) {
  const d = document.createElement('div');
  d.className = 'tost' + (mal ? ' mal' : '');
  d.textContent = txt;
  document.getElementById('tostadas').appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

/* ---------- Verificador ---------- */

const SIN_ETIQUETA = ['hidden', 'submit', 'button', 'reset', 'image'];

function limpiaDoc(doc) {
  doc.querySelectorAll('script,iframe,object,embed,link,base,meta[http-equiv]').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(n => {
    [...n.attributes].forEach(a => {
      if (/^on/i.test(a.name)) n.removeAttribute(a.name);
      if (a.name === 'href' && /^javascript:/i.test(a.value)) n.removeAttribute(a.name);
    });
  });
}

function alcanceCss(css, pref) {
  css = css.replace(/\/\*[\s\S]*?\*\//g, '').replace(/@import[^;]*;/gi, '');
  let out = '', i = 0;
  while (i < css.length) {
    const abre = css.indexOf('{', i);
    if (abre === -1) break;
    const sel = css.slice(i, abre).trim();
    if (/^@(media|supports|layer|container)/i.test(sel)) {
      let n = 1, j = abre + 1;
      while (j < css.length && n > 0) { if (css[j] === '{') n++; if (css[j] === '}') n--; j++; }
      out += sel + '{' + alcanceCss(css.slice(abre + 1, j - 1), pref) + '}';
      i = j;
      continue;
    }
    let n = 1, j = abre + 1;
    while (j < css.length && n > 0) { if (css[j] === '{') n++; if (css[j] === '}') n--; j++; }
    const cuerpo = css.slice(abre + 1, j - 1);
    if (/^@/.test(sel)) out += sel + '{' + cuerpo + '}';
    else {
      const sels = sel.split(',').map(s => {
        s = s.trim();
        if (!s) return '';
        if (/^(html|body|:root)\b/i.test(s)) return pref + s.replace(/^(html|body|:root)/i, '');
        return pref + ' ' + s;
      }).filter(Boolean).join(',');
      if (sels) out += sels + '{' + cuerpo + '}';
    }
    i = j;
  }
  return out;
}

function lum(c) {
  const m = c.match(/rgba?\(([^)]+)\)/);
  if (!m) return null;
  const p = m[1].split(',').map(x => parseFloat(x));
  if (p.length > 3 && p[3] === 0) return null;
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(p[0]) + 0.7152 * f(p[1]) + 0.0722 * f(p[2]);
}

function fondoReal(el, tope) {
  let n = el;
  while (n && n !== tope.parentNode) {
    const c = getComputedStyle(n).backgroundColor;
    const l = lum(c);
    if (l !== null) return l;
    n = n.parentElement;
  }
  return 1;
}

function cuenta(doc, sel) {
  try { return doc.querySelectorAll(sel).length; } catch (e) { return -1; }
}

async function inflaBase64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const flujo = new Blob([bytes]).stream()
    .pipeThrough(new DecompressionStream('gzip'));
  return await new Response(flujo).text();
}

function verifica(html, css, checks, js) {
  js = js || '';
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const hojas = [...doc.querySelectorAll('link[rel~="stylesheet" i]')]
    .map(x => ({ href: x.getAttribute('href') || '', enCabeza: !!x.closest('head') }));
  const guiones = [...doc.querySelectorAll('script')].map(x => ({
    src: x.getAttribute('src') || '',
    defer: x.hasAttribute('defer') || x.hasAttribute('async'),
    enCabeza: !!x.closest('head'),
    cuerpo: (x.textContent || '').trim()
  }));
  const manejadores = [...doc.querySelectorAll('*')]
    .filter(e => [...e.attributes].some(x => /^on/i.test(x.name))).length;
  limpiaDoc(doc);
  const res = [];
  const VISUALES = ['ancho390', 'contraste', 'computa', 'anchoen'];
  const necesitaPintar = checks.some(c => VISUALES.includes(c[0]));
  let caja = null;

  if (necesitaPintar) {
    const l = document.getElementById('lienzo');
    l.innerHTML = '';
    caja = document.createElement('div');
    caja.id = 'lienzoCaja';
    const anchoLienzo = (checks.find(c => c[0] === 'anchoen') || [])[1] || '390';
    caja.style.cssText = 'width:' + (+anchoLienzo || 390) + 'px';
    const base = document.createElement('style');
    base.textContent = '#lienzoCaja{background:#fff;color:#000;'
      + 'font-family:serif;font-size:16px;line-height:normal}';
    caja.appendChild(base);
    if (css.trim()) {
      const st = document.createElement('style');
      st.textContent = alcanceCss(css, '#lienzoCaja');
      caja.appendChild(st);
    }
    const env = document.createElement('div');
    env.innerHTML = doc.body ? doc.body.innerHTML : html;
    caja.appendChild(env);
    l.appendChild(caja);
  }

  for (const c of checks) {
    const t = c[0];
    if (t === 'doctype')
      res.push(r(!!doc.doctype, 'Declaración `<!DOCTYPE html>`',
        doc.doctype ? '' : 'No aparece, o no es la primera línea del documento'));
    else if (t === 'lang') {
      const v = doc.documentElement && doc.documentElement.getAttribute('lang');
      res.push(r(!!v, 'Idioma declarado en `<html lang>`', v ? 'lang="' + v + '"' : 'Falta el atributo lang'));
    }
    else if (t === 'charset') {
      const m = doc.querySelector('meta[charset]');
      res.push(r(!!m, 'Codificación declarada', m ? '' : 'Falta <meta charset="UTF-8">'));
    }
    else if (t === 'viewport') {
      const m = doc.querySelector('meta[name="viewport"]');
      const ok = m && /width\s*=\s*device-width/i.test(m.getAttribute('content') || '');
      res.push(r(!!ok, 'Etiqueta viewport para móviles',
        m ? (ok ? '' : 'Falta width=device-width en el content') : 'Falta la etiqueta viewport'));
    }
    else if (t === 'title') {
      const ti = (doc.title || '').trim();
      res.push(r(!!ti, 'Título de la pestaña', ti ? '«' + ti + '»' : 'Falta el <title> o está vacío'));
    }
    else if (t === 'sel') {
      const sel = c[1], min = +(c[2] || 1), max = c[3] ? +c[3] : Infinity;
      const n = cuenta(doc, sel);
      if (n < 0) { res.push(r(false, 'Selector `' + sel + '`', 'Selector no válido')); continue; }
      const ok = n >= min && n <= max;
      const esperado = max === Infinity ? ('al menos ' + min) : (min === max ? ('exactamente ' + min) : (min + ' a ' + max));
      res.push(r(ok, 'Elementos que encajan con `' + sel + '`', 'Encontrados ' + n + ', se esperaban ' + esperado));
    }
    else if (t === 'attr') {
      const els = [...doc.querySelectorAll(c[1])];
      const mal = els.filter(e => !(e.getAttribute(c[2]) || '').trim());
      if (!els.length) res.push(d('No hay elementos `' + c[1] + '` que comprobar', 'Ninguno encontrado'));
      else res.push(r(!mal.length, 'Todos los `' + c[1] + '` tienen `' + c[2] + '`',
        mal.length ? mal.length + ' sin ' + c[2] : els.length + ' comprobados'));
    }
    else if (t === 'texto') {
      const els = [...doc.querySelectorAll(c[1])];
      const ok = els.some(e => (e.textContent || '').toLowerCase().includes(c[2].toLowerCase()));
      res.push(r(ok, 'En `' + c[1] + '` aparece «' + c[2] + '»', ok ? '' : 'No se encuentra ese texto'));
    }
    else if (t === 'alt') {
      const imgs = [...doc.querySelectorAll('img')];
      const sin = imgs.filter(i => !i.hasAttribute('alt'));
      const vacios = imgs.filter(i => i.hasAttribute('alt') && !i.getAttribute('alt').trim());
      if (!imgs.length) res.push(d('No hay imágenes que comprobar', ''));
      else res.push(r(!sin.length, 'Todas las imágenes tienen `alt`',
        sin.length ? sin.length + ' sin alt' : imgs.length + ' imágenes, ' + vacios.length + ' con alt vacío (decorativas)'));
    }
    else if (t === 'labels') {
      const ctr = [...doc.querySelectorAll('input,select,textarea')]
        .filter(e => !SIN_ETIQUETA.includes((e.getAttribute('type') || '').toLowerCase()));
      const mal = ctr.filter(e => {
        if (e.closest('label')) return false;
        const id = e.getAttribute('id');
        if (id && doc.querySelector('label[for="' + CSS.escape(id) + '"]')) return false;
        if ((e.getAttribute('aria-label') || '').trim()) return false;
        return true;
      });
      if (!ctr.length) res.push(d('Etiquetas de los campos', 'No hay campos de formulario en esta pagina'));
      else res.push(r(!mal.length, 'Todos los campos tienen etiqueta',
        mal.length ? mal.length + ' campo(s) sin <label>: ' + mal.map(e => e.getAttribute('name') || e.tagName.toLowerCase()).join(', ')
          : ctr.length + ' campos comprobados'));
    }
    else if (t === 'nombres') {
      const ctr = [...doc.querySelectorAll('input,select,textarea')]
        .filter(e => !['submit', 'button', 'reset', 'image'].includes((e.getAttribute('type') || '').toLowerCase()));
      const mal = ctr.filter(e => !(e.getAttribute('name') || '').trim());
      if (!ctr.length) res.push(d('Atributo `name` de los campos', 'No hay campos de formulario en esta pagina'));
      else res.push(r(!mal.length, 'Todos los campos tienen `name`',
        mal.length ? mal.length + ' sin name: el dato no llegaría al servidor' : ctr.length + ' campos comprobados'));
    }
    else if (t === 'orden') {
      const hs = [...doc.querySelectorAll('h1,h2,h3,h4,h5,h6')].map(h => +h.tagName[1]);
      const h1 = hs.filter(x => x === 1).length;
      let salto = null;
      for (let k = 1; k < hs.length; k++) if (hs[k] > hs[k - 1] + 1) { salto = 'h' + hs[k - 1] + ' → h' + hs[k]; break; }
      const ok = h1 === 1 && !salto;
      res.push(r(ok, 'Jerarquía de encabezados',
        ok ? hs.length + ' encabezados, sin saltos'
          : (h1 !== 1 ? 'Hay ' + h1 + ' elementos h1, debe haber uno' : 'Salto de nivel: ' + salto)));
    }
    else if (t === 'noinline') {
      const n = doc.querySelectorAll('[style]').length;
      res.push(r(n === 0, 'Sin atributos `style`', n ? n + ' elemento(s) con style' : ''));
    }
    else if (t === 'noobs') {
      const obs = [...doc.querySelectorAll('font,center,marquee,big,strike,tt,blink,frame,frameset')];
      const pres = [...doc.querySelectorAll('[bgcolor],[align],[border]:not(table):not(img)')];
      const total = obs.length + pres.length;
      res.push(r(total === 0, 'Sin etiquetas ni atributos de presentación',
        total ? obs.map(e => '<' + e.tagName.toLowerCase() + '>').join(' ') + ' ' + (pres.length ? pres.length + ' atributo(s)' : '') : ''));
    }
    else if (t === 'unicoid') {
      const ids = [...doc.querySelectorAll('[id]')].map(e => e.getAttribute('id'));
      const rep = ids.filter((x, k) => ids.indexOf(x) !== k);
      res.push(r(!rep.length, 'Ningún `id` repetido', rep.length ? 'Repetidos: ' + [...new Set(rep)].join(', ') : ids.length + ' id comprobados'));
    }
    else if (t === 'anida') {
      const fallos = [];
      doc.querySelectorAll('ul,ol').forEach(l => {
        [...l.children].forEach(h => {
          if (!['LI', 'SCRIPT', 'TEMPLATE'].includes(h.tagName))
            fallos.push('<' + h.tagName.toLowerCase() + '> como hijo directo de <' + l.tagName.toLowerCase() + '>');
        });
      });
      doc.querySelectorAll('li').forEach(li => {
        if (!li.parentElement || !['UL', 'OL', 'MENU'].includes(li.parentElement.tagName))
          fallos.push('<li> fuera de una lista');
      });
      doc.querySelectorAll('dt,dd').forEach(e => {

      const u = [...new Set(fallos)];
      res.push(r(!u.length, 'Anidamiento válido', u.length ? u.slice(0, 4).join(' · ') : ''));
    }
    else if (t === 'ancho390' && caja) {
      const desb = [];
      caja.querySelectorAll('*').forEach(e => {

        if (rc.width > 0 && rc.right > rb.left + 391.5) desb.push(e.tagName.toLowerCase());
      });

        const lf = lum(cs.color);
        if (lf === null) return;
        const lb = fondoReal(e, caja);
        const ra = (Math.max(lf, lb) + 0.05) / (Math.min(lf, lb) + 0.05);
        if (ra < min) malos.push(e.tagName.toLowerCase() + ' (' + ra.toFixed(1) + ':1)');
      });
      res.push(r(!malos.length, 'Contraste de texto ≥ ' + min + ':1',
        malos.length ? [...new Set(malos)].slice(0, 4).join(', ') : ''));
    }
    else if (t === 'anchoen') { /* solo configura el lienzo */ }
    else if (t === 'cssenlace') {
      const ok = hojas.length > 0 && hojas.every(x => x.enCabeza && x.href.trim());
      let det = '';
      if (!hojas.length) det = 'No hay ning\u00fan <link rel="stylesheet">';
      else if (hojas.some(x => !x.href.trim())) det = 'Hay un <link> sin href';
      else if (hojas.some(x => !x.enCabeza)) det = 'El <link> debe ir dentro del <head>';
      else det = hojas.map(x => x.href).join(', ');
      res.push(r(ok, 'La hoja de estilos se enlaza desde el `<head>`', det));
    }
    else if (t === 'cssfuera') {
      const emb = doc.querySelectorAll('style').length;
      const inl = doc.querySelectorAll('[style]').length;
      const ok = !emb && !inl;
      const p = [];
      if (emb) p.push(emb + ' bloque(s) <style> en el HTML');
      if (inl) p.push(inl + ' atributo(s) style');

    }

      const prop = (c[1] || '').trim();
      const min = +(c[2] || 1);

          n ? n + ' declaración(es) encontradas' : ''));
    }
    else if (t === 'cssregla') {
      const rx = new RegExp(c[1], 'i');
      const sinCom = css.replace(/\/\*[\s\S]*?\*\//g, '');
      res.push(r(rx.test(sinCom), c[2] || ('La hoja contiene `' + c[1] + '`'),

    else if (t === 'media') {

        });
        return '';
      });
      res.push(r(!largos.length, 'Ningún selector encadena más de ' + max + ' partes',
        largos.length ? largos.slice(0, 3).join(' · ') : ''));

    else if (t === 'computa' && caja) {
      const sel = c[1], prop = c[2], esperado = c[3] || '';

      catch (e) { res.push(r(false, 'Selector `' + sel + '`', 'Selector no válido')); continue; }
      if (!els.length) {
        res.push(r(false, '`' + prop + '` en `' + sel + '`', 'Ningún elemento encaja con el selector'));
        continue;

      res.push(d('Comprobación visual no ejecutada', 'Hace falta contenido en el cuerpo'));
    else if (t === 'jsusa' || t === 'jsevita') {
      const patron = c[1] || '';
      const etiqueta = c[2] || ('`' + patron + '`');
      if (!js.trim()) {
        res.push(d(etiqueta, 'No has pegado ningún JavaScript'));
        continue;
      }
      const limpio = js.replace(/\/\*[\s\S]*?\*\//g, '').replace(/(^|[^:])\/\/[^\n]*/g, '$1');
      let hay = false;
      try { hay = new RegExp(patron).test(limpio); }
      catch (e) { res.push(r(false, etiqueta, 'Patrón no válido')); continue; }
      if (t === 'jsusa')
        res.push(r(hay, 'Usa ' + etiqueta, hay ? '' : 'No aparece en tu JavaScript'));
      else
        res.push(r(!hay, 'No usa ' + etiqueta, hay ? 'Aparece en tu JavaScript' : ''));
    }
    else if (t === 'scriptdefer') {
      const ext = guiones.filter(g => g.src);
      if (!ext.length) { res.push(d('El script se carga sin bloquear', 'No hay ningun <script src>')); continue; }

      res.push(r(!mal.length, 'El script se carga sin bloquear el dibujado',
        mal.length ? 'Hay un <script> en el <head> sin defer' : ''));
    }
    else if (t === 'jsfuera') {
      const emb = guiones.filter(g => !g.src && g.cuerpo).length;
      const p = [];
      if (emb) p.push(emb + ' bloque(s) <script> con codigo dentro del HTML');
      if (manejadores) p.push(manejadores + ' atributo(s) tipo onclick');
      res.push(r(!emb && !manejadores, 'Todo el JavaScript vive en el archivo aparte', p.join(' \u00b7 ')));
    }
    else if (t === 'ancho390' || t === 'contraste')
      res.push(d('Comprobación visual no ejecutada', 'Hace falta contenido en el cuerpo'));
  }
  if (caja) document.getElementById('lienzo').innerHTML = '';
  return res;

  function r(ok, titulo, detalle) { return { e: ok ? 'si' : 'no', titulo, detalle }; }
  function d(titulo, detalle) { return { e: 'duda', titulo, detalle }; }
}

function hesc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function sp(cls, t) { return '<span class="' + cls + '">' + hesc(t) + '</span>'; }

const KW_JS = new Set('const let var function return if else for while do switch case break continue new class extends super this import export from default async await try catch finally throw typeof instanceof in of null undefined true false static get set delete void yield NaN Infinity'.split(' '));

function resaltaJS(c) {
  const rx = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\[\s\S]|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b)|([A-Za-z_$][\w$]*)(\s*\()?|([{}()[\];,.:?=<>!+\-*/%&|]+)/g;

    else if (m[3]) out += sp('t-num', m[3]);
    else if (m[4]) {
      if (KW_JS.has(m[4])) out += sp('t-kw', m[4]) + hesc(m[5] || '');
      else if (m[5]) out += sp('t-fn', m[4]) + hesc(m[5]);
      else out += hesc(m[4]);

function resaltaCSS(c) {

    if (!buf) return;

    else if (mode === 'prop') out += sp('t-prop', buf);
    else out += valCSS(buf);

    const ch = c[i];
    if (c.startsWith('/*', i)) { flush(); const j = c.indexOf('*/', i + 2); const e = j < 0 ? c.length : j + 2; out += sp('t-com', c.slice(i, e)); i = e; continue; }
    if (ch === '{') { flush(); out += sp('t-punc', ch); depth++; mode = 'prop'; i++; continue; }
    if (ch === '}') { flush(); out += sp('t-punc', ch); depth = Math.max(0, depth - 1); mode = depth ? 'prop' : 'sel'; i++; continue; }

    }
    if (ch === ';' && mode === 'val') { flush(); out += sp('t-punc', ch); mode = 'prop'; i++; continue; }
    if (ch === '\n' && mode === 'prop' && !buf.trim()) { out += buf + ch; buf = ''; i++; continue; }
    buf += ch; i++;

}
function valCSS(v) {
  return v.replace(/("[^"]*"|'[^']*')|(#[0-9a-fA-F]{3,8}\b)|(-?\d*\.?\d+(?:px|rem|em|%|vh|vw|fr|s|ms|deg|ch|dvh|svh|vmin|vmax)?)\b|(!important)|([\w-]+(?=\())|([^"'#\d!\w-]+|[\w-]+)/g,
    (m, s, h, n, imp, fn, rest) => s ? sp('t-str', s) : h ? sp('t-num', h) : n ? sp('t-num', n) : imp ? sp('t-kw', imp) : fn ? sp('t-fn', fn) : hesc(m));

function resaltaHTML(c) {
  let out = '', i = 0;
  while (i < c.length) {
    if (c.startsWith('<!--', i)) { const j = c.indexOf('-->', i); const e = j < 0 ? c.length : j + 3; out += sp('t-com', c.slice(i, e)); i = e; continue; }
    if (c[i] === '<' && /[a-zA-Z!\/]/.test(c[i + 1] || '')) {

function bloqueControles(lineas) {
  const items = [];
  for (const l of lineas) {
    if (/^##\s/.test(l)) { const p = l.slice(3).split('|'); items.push({ n: p[0].trim(), d: (p[1] || '').trim(), c: [] }); }
    else if (items.length) items[items.length - 1].c.push(l);
  }
  return '<div class="ctl-g"><div class="ctl-cab"><span>Control</span><span>Código</span><span>Cómo se ve</span></div>' + items.map(it => {
    const code = it.c.join('\n').trim();
    return '<div class="ctl-f"><div class="ctl-n"><b>' + hesc(it.n) + '</b><span>' + linea(it.d) + '</span></div>' +
      '<pre class="ctl-c"><code>' + resalta(code, 'html') + '</code></pre>' +
      '<div class="ctl-v" aria-label="Vista previa de ' + hesc(it.n) + '">' + code + '</div></div>';
  }).join('') + '</div>';
}

function bloqueCodigo(lang, estado, rotulo, code) {
  lang = (lang || '').toLowerCase(); if (lang === 'javascript') lang = 'js';
  const idx = CODS.push(code) - 1;
  const cls = ['mal', 'bien'].includes(estado) ? ' cod-' + estado : '';
  const marca = estado === 'mal' ? '\u2715' : estado === 'bien' ? '\u2713' : '';
  const run = lang === 'js' && ejecutable(code);
  const vista = lang === 'html' && /<[a-z]/i.test(code) && code.length > 20;
  return '<div class="bloquecod' + cls + '" data-cod="' + idx + '" data-lang="' + lang + '">' +
    '<div class="cod-cab">' + (lang ? '<span class="cod-lang" data-l="' + lang + '">' + (LANGN[lang] || lang) + '</span>' : '') +
    (rotulo || marca ? '<span class="cod-rotulo">' + (marca ? '<span class="cod-marca">' + marca + '</span>' : '') + hesc(rotulo) + '</span>' : '') +
    '<span class="cod-acc">' +
    (run ? '<button class="cod-b run" data-acc="ejecutar" title="Ejecuta el código y muestra la consola">\u25B6 Ejecutar</button>' : '') +
    (vista ? '<button class="cod-b" data-acc="vistaprev" title="Muestra cómo lo pinta el navegador">Ver resultado</button>' : '') +
    '<button class="cod-b" data-acc="copiar">Copiar</button></span></div>' +
    '<pre><code>' + resalta(code, lang) + '</code></pre></div>';
}

/* ---------- ejecución aislada en un iframe ---------- */
let RUN_N = 0;
const RUN_DEST = {};
window.addEventListener('message', ev => {
  const d = ev.data; if (!d || !d.__lm || !RUN_DEST[d.__lm]) return;
  const box = RUN_DEST[d.__lm];
  const vacio = box.querySelector('.lin.info.espera'); if (vacio) vacio.remove();
  const l = document.createElement('div'); l.className = 'lin ' + (d.t === 'log' ? '' : d.t); l.textContent = d.a.join(' ');
  box.appendChild(l);
});
function ejecutaJS(code, box) {
  const id = 'r' + (++RUN_N);
  box.innerHTML = '<div class="lin info espera">Ejecutando…</div>'; box.hidden = false;
  RUN_DEST[id] = box;
  const pre = `<script>
  (function(){
    var ID=${JSON.stringify(id)};
    function f(v,d){d=d||0;try{if(v===undefined)return 'undefined';if(v===null)return 'null';if(typeof v==='string')return d?JSON.stringify(v):v;if(typeof v==='function')return 'ƒ '+(v.name||'anónima')+'()';if(v instanceof Error)return v.name+': '+v.message;if(typeof v==='bigint')return v+'n';if(typeof v!=='object')return String(v);if(d>2)return Array.isArray(v)?'[…]':'{…}';if(v instanceof Promise)return 'Promise {…}';if(Array.isArray(v))return '['+v.map(function(x){return f(x,d+1)}).join(', ')+']';if(v instanceof Map)return 'Map('+v.size+') {'+[...v].map(function(e){return f(e[0],d+1)+' => '+f(e[1],d+1)}).join(', ')+'}';if(v instanceof Set)return 'Set('+v.size+') {'+[...v].map(function(x){return f(x,d+1)}).join(', ')+'}';var n=v.constructor&&v.constructor.name!=='Object'?v.constructor.name+' ':'';return n+'{'+Object.keys(v).map(function(k){return k+': '+f(v[k],d+1)}).join(', ')+'}'}catch(e){return String(v)}}
    function out(t,a){parent.postMessage({__lm:ID,t:t,a:Array.prototype.map.call(a,function(x){return f(x)})},'*')}
    console.log=function(){out('log',arguments)};console.info=function(){out('info',arguments)};
    console.warn=function(){out('warn',arguments)};console.error=function(){out('error',arguments)};
    console.table=function(t){out('log',[t])};
    window.onerror=function(m){out('error',[String(m).replace(/^Uncaught /,'')]);return true};
    window.addEventListener('unhandledrejection',function(e){out('error',['Promesa rechazada sin catch: '+(e.reason&&e.reason.message||e.reason)])});
  })();
  <\/script>`;
  const fr = document.createElement('iframe'); fr.setAttribute('sandbox', 'allow-scripts'); fr.style.display = 'none';
  fr.srcdoc = pre + '<script>' + code.replace(/<\/script/gi, '<\\/script') + '<\/script>';
  document.body.appendChild(fr);
  setTimeout(() => {
    const e = box.querySelector('.espera'); if (e) { e.textContent = '(sin salida en la consola)'; e.classList.remove('espera'); }
  }, 1600);
  setTimeout(() => { fr.remove(); delete RUN_DEST[id]; }, 6000);
}
function vistaHTML(code, bloque) {
  let v = bloque.querySelector('.cod-vista');
  if (v) { v.remove(); return; }
  v = document.createElement('div'); v.className = 'cod-vista';
  const fr = document.createElement('iframe'); fr.setAttribute('sandbox', 'allow-same-origin'); fr.title = 'Resultado del HTML';
  const base = '<style>body{font-family:system-ui,sans-serif;margin:12px;color:#111}</style>';
  fr.srcdoc = /<html|<body|<!doctype/i.test(code) ? code.replace(/<head>/i, '<head>' + base) : base + code;
  fr.onload = () => { try { fr.style.height = Math.min(520, fr.contentDocument.documentElement.scrollHeight + 10) + 'px'; } catch (e) { fr.style.height = '260px'; } };

}

let SIM_TIMERS = [];

  const g = H('div', { class: 'grp', role: 'group' }); if (label) g.appendChild(H('span', { class: 'lab' }, label));
  const bs = items.map((it, i) => { const b = H('button', { type: 'button', class: 'pill', 'aria-pressed': String(i === init) }, typeof it === 'string' ? it : it.l); b.onclick = () => { set(i); onPick(items[i], i); }; g.appendChild(b); return b; });
  function set(i) { bs.forEach((b, j) => b.setAttribute('aria-pressed', String(i === j))); }
  host.appendChild(g); return { set, bs, el: g };
}
function boton(host, label, fn, cls = '') { const b = H('button', { type: 'button', class: 'b ' + cls }, label); b.onclick = fn; host.appendChild(b); return b; }
function rango(host, { l, min, max, step = 1, v, f = x => x, on }) {
  const w = H('label', { class: 'rng' }, '<span>' + l + '</span><input type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + v + '"><output>' + f(v) + '</output>');
  const i = w.querySelector('input'), o = w.querySelector('output');
  i.addEventListener('input', () => { o.textContent = f(+i.value); on && on(+i.value); }); host.appendChild(w);
  return { el: w, get v() { return +i.value; }, set(x) { i.value = x; o.textContent = f(+x); } };
}
function casilla(host, l, v, on) { const w = H('label', { class: 'rng' }, '<input type="checkbox"' + (v ? ' checked' : '') + '> <span>' + l + '</span>'); const i = w.querySelector('input'); i.onchange = () => on(i.checked); host.appendChild(w); return i; }
function mensaje(host, txt = '', k = '') { const d = H('div', { class: 'sim-msg ' + k }, txt); host.appendChild(d); return (t, kk = '') => { d.className = 'sim-msg ' + kk; d.innerHTML = t; }; }
function codigoHTML(code, lang) { return '<pre class="mini-cod"><code>' + resalta(code, lang) + '</code></pre>'; }

    const carril = esc.querySelector('.red-carril'), pag = esc.querySelector('.mini-pag'), srvT = esc.querySelector('.srv-txt');
    function reinicia() {

      srvT.textContent = origen === 'file' ? 'C:\\proyectos\\web\\' : caido ? 'sin responder' : 'localhost:5500';

    async function pide(a, t0) {

      pag.className = 'mini-pag cruda'; pag.innerHTML = '<h4>Mi portfolio</h4><p>Proyectos de 1.º DAM</p><div class="ph logo"></div><div class="ph foto"></div><ul class="datos"></ul>';
      msg('El navegador ya tiene el HTML y empieza a leerlo. Cada <code>&lt;link&gt;</code>, <code>&lt;script&gt;</code> e <code>&lt;img&gt;</code> que encuentra <b>es una petición nueva</b>.');
      await espera(250);
      const res = await Promise.all(ARCH.slice(1, 5).map((a, i) => espera(i * 90).then(() => pide(a, 320 + i * 90)).then(r => {

      let fin;

      else fin = js;

      const n = tabla.querySelectorAll('.rt-f').length;
      if (origen === 'file') msg(`Abierto con doble clic no hay servidor: los archivos se leen del disco. HTML, CSS e imágenes funcionan, pero <b>los módulos y <code>fetch</code> quedan bloqueados</b> por seguridad (CORS, origen <code>null</code>). Por eso el curso usa Live Server desde el primer día.`, 'av');

      else msg(`<b>${n} peticiones</b> para una sola página: una por archivo. Toca una fila para ver la petición y la respuesta en crudo.`, 'ok');
    }

  }
});

defSim('url', {
  t: 'Diseccionar una URL', b: '0',
  d: 'Escribe o elige una dirección y mira de qué partes está hecha. Cada color es una pieza distinta.',
  mount(el) {
    const EJ = ['https://www.ejemplo.es:443/cursos/index.html?grupo=A#ejercicio', 'http://localhost:5500/paginas/contacto.html', 'https://api.recetas.dev/v1/recetas?busca=tortilla&pagina=2', 'https://midominio.es/app/#/recetas/7?orden=nombre'];
    const c = fila(el); pills(c, ['Curso', 'Live Server', 'API', 'Aplicación con rutas'], (it, i) => { inp.value = EJ[i]; pinta(); }, 0);
    const inp = H('input', { class: 'txt', type: 'text', 'aria-label': 'URL', spellcheck: 'false', value: EJ[0] }); el.appendChild(inp);
    const vis = add(el, '<div class="url-vis mono"></div>');
    const tab = add(el, '<div class="url-tab"></div>');
    const msg = mensaje(el);
    inp.addEventListener('input', pinta);
    const COL = { esq: '#E5484D', host: '#2760D6', puerto: '#A87300', ruta: '#15875A', cons: '#6C42CC', frag: '#C22E63' };
    function pinta() {
      let u; try { u = new URL(inp.value.trim()); } catch (e) { vis.innerHTML = '<span class="muted">' + hesc(inp.value) + '</span>'; tab.innerHTML = ''; msg('Esto no es una URL completa: falta el esquema (<code>https://</code>) o tiene espacios.', 'mal'); return; }
      const defP = { 'https:': '443', 'http:': '80' }[u.protocol];
      const partes = [
        ['esq', u.protocol + '//', 'Esquema o protocolo', 'Cómo se habla con el servidor. <code>https</code> va cifrado.'],
        ['host', u.hostname, 'Host', 'El servidor al que se llega. ' + (u.hostname === 'localhost' ? '<b>localhost</b> es tu propio ordenador.' : 'Se traduce a una dirección IP (DNS).')],
        ['puerto', u.port ? ':' + u.port : '', 'Puerto', u.port ? 'Puerta del servidor. ' + (u.port === defP ? 'Es el habitual de ' + u.protocol.slice(0, -1) + ', así que se podría omitir.' : 'No es el habitual: hay que escribirlo.') : 'No se escribe: se usa el habitual (' + (defP || '—') + ').'],
        ['ruta', u.pathname, 'Ruta', 'Qué recurso pides dentro del servidor. Distingue mayúsculas en la mayoría de servidores.'],
        ['cons', u.search, 'Parámetros de consulta', u.search ? [...u.searchParams].map(([k, v]) => '<code>' + hesc(k) + '</code> = <code>' + hesc(v) + '</code>').join(' · ') : 'No hay.'],
        ['frag', u.hash, 'Fragmento', u.hash ? (u.hash.startsWith('#/') ? 'Aquí lo usa la aplicación para sus <b>rutas internas</b> (apartado S53).' : 'Salta a un elemento con ese <code>id</code>. <b>Nunca se envía al servidor.</b>') : 'No hay.'],
      ];
      vis.innerHTML = partes.map(([k, t]) => t ? `<span class="u-p" style="--c:${COL[k]}">${hesc(t)}</span>` : '').join('');
      tab.innerHTML = partes.map(([k, t, n, e]) => `<div class="u-f"><span class="u-n" style="--c:${COL[k]}">${n}</span><span class="mono">${t ? hesc(t) : '<span class="muted">—</span>'}</span><span>${e}</span></div>`).join('');
      msg(`Al servidor llega: <code>GET ${hesc(u.pathname + u.search)}</code> en <code>${hesc(u.host)}</code>. El fragmento ${u.hash ? '<code>' + hesc(u.hash) + '</code> ' : ''}se queda en el navegador.`, 'ok');
    }

  }

/* ---------- 3. Rutas relativas ---------- */
defSim('rutas', {
  t: 'Calcular rutas relativas', b: '0',
  d: 'Elige desde qué archivo escribes y a qué archivo quieres llegar. El simulador calcula la ruta y te enseña el camino. También puedes escribir una ruta y ver a dónde lleva de verdad.',
  mount(el) {
    const ARB = ['index.html', 'contacto.html', 'css/estilos.css', 'img/logo.png', 'img/fotos/playa.jpg', 'paginas/equipo.html', 'paginas/blog/post.html', 'js/app.js'];
    const desde = ['index.html', 'contacto.html', 'css/estilos.css', 'paginas/equipo.html', 'paginas/blog/post.html', 'js/app.js'];
    let d = 'paginas/equipo.html', a = 'img/logo.png';
    const c1 = fila(el); const sd = H('select', { class: 'sel', 'aria-label': 'Archivo desde el que escribes' }, desde.map(x => `<option${x === d ? ' selected' : ''}>${x}</option>`).join(''));
    const sa = H('select', { class: 'sel', 'aria-label': 'Archivo al que quieres llegar' }, ARB.map(x => `<option${x === a ? ' selected' : ''}>${x}</option>`).join(''));
    c1.append(H('span', { class: 'lab' }, 'Estoy en'), sd, H('span', { class: 'lab' }, 'Quiero llegar a'), sa);
    const dos = add(el, '<div class="dos"><div class="arbol-f mono"></div><div class="stack-r"></div></div>');
    const arbolEl = dos.querySelector('.arbol-f'), der = dos.querySelector('.stack-r');
    der.innerHTML = `<div class="panel"><span class="lab">Ruta que tienes que escribir</span><div class="ruta-res mono"></div><div class="pasos-r"></div></div>
      <label class="campo" style="margin-top:0"><span>Prueba tú una ruta</span><input class="txt" id="rutaPrueba" spellcheck="false" placeholder="../img/logo.png"></label><div class="res-prueba"></div>`;
    const inP = der.querySelector('input'), resP = der.querySelector('.res-prueba');
    sd.onchange = () => { d = sd.value; pinta(); prueba(); }; sa.onchange = () => { a = sa.value; pinta(); };
    inP.oninput = prueba;
    const dir = p => p.split('/').slice(0, -1);
    function relativa(from, to) { const f = dir(from), t = to.split('/'); let i = 0; while (i < f.length && i < t.length - 1 && f[i] === t[i]) i++; return { sube: f.length - i, baja: t.slice(i), ruta: '../'.repeat(f.length - i) + t.slice(i).join('/') }; }
    function resuelve(from, rel) {
      if (/\\/.test(rel)) return { err: 'Usa barras normales <code>/</code>. La barra invertida <code>\\</code> es de Windows y en la web no funciona.' };
      if (/^[a-z]:/i.test(rel) || rel.startsWith('file:')) return { err: 'Es una ruta absoluta de <b>tu disco</b>. En el ordenador de otra persona (o en el servidor) esa carpeta no existe.' };
      let parts = rel.startsWith('/') ? [] : dir(from); const segs = rel.replace(/^\//, '').split('/');
      for (const s of segs) { if (s === '..') { if (!parts.length) return { err: 'Sube más carpetas de las que hay: te sales del proyecto.' }; parts.pop(); } else if (s !== '.' && s !== '') parts.push(s); }
      const p = parts.join('/'); const exacta = ARB.includes(p); const casi = ARB.find(x => x.toLowerCase() === p.toLowerCase());
      if (exacta) return { ok: p, raiz: rel.startsWith('/') };
      if (casi) return { err: `Casi: existe <code>${casi}</code>, pero no <code>${hesc(p)}</code>. <b>En el servidor las mayúsculas cuentan</b>: en Windows funciona y al subirlo da 404.` };
      return { err: `Lleva a <code>${hesc(p || '(carpeta raíz)')}</code>, que no existe: <b>404</b>.` };
    }
    function arbol(marca) {
      const carpetas = new Set(); ARB.forEach(p => { const ds = dir(p); ds.forEach((_, i) => carpetas.add(ds.slice(0, i + 1).join('/'))); });
      const items = [...carpetas].map(c => ({ p: c, dir: true })).concat(ARB.map(p => ({ p, dir: false }))).sort((x, y) => x.p.localeCompare(y.p));
      arbolEl.innerHTML = '<div class="af-i raiz"><i class="ic-dir"></i>proyecto/</div>' + items.map(it => { const n = it.p.split('/'); const cls = (it.p === d ? ' desde' : '') + (it.p === (marca || a) ? ' hasta' : '') + (camino.has(it.p) ? ' camino' : ''); return `<div class="af-i${cls}" style="padding-left:${n.length * 18}px">${it.dir ? '<i class="ic-dir"></i>' + n.at(-1) + '/' : '<i class="ic-file"></i>' + n.at(-1)}</div>`; }).join('');
    }
    let camino = new Set();
    function pinta() {
      const r = relativa(d, a); camino = new Set(); const f = dir(d); for (let i = 0; i <= f.length; i++) camino.add(f.slice(0, i).join('/'));
      const comun = f.slice(0, f.length - r.sube); r.baja.forEach((_, i) => camino.add(comun.concat(r.baja.slice(0, i + 1)).join('/')));
      camino.delete('');
      arbol();
      der.querySelector('.ruta-res').innerHTML = r.ruta.split('/').map(s => s === '..' ? '<span class="sube">..</span>' : '<span class="baja">' + s + '</span>').join('<span class="muted">/</span>');
      const pasos = []; if (r.sube) pasos.push(`Sube <b>${r.sube}</b> carpeta${r.sube > 1 ? 's' : ''} con <code>${'../'.repeat(r.sube)}</code> (hasta <code>${comun.join('/') || 'proyecto'}/</code>)`);
      else pasos.push(`Los dos archivos comparten carpeta <code>${comun.join('/') || 'proyecto'}/</code>: no hay que subir`);
      if (r.baja.length > 1) pasos.push(`Entra en <code>${r.baja.slice(0, -1).join('/')}/</code>`);
      pasos.push(`Llega a <code>${r.baja.at(-1)}</code>`);
      der.querySelector('.pasos-r').innerHTML = '<ol>' + pasos.map(p => '<li>' + p + '</li>').join('') + '</ol>';
    }
    function prueba() {
      const v = inP.value.trim(); if (!v) { resP.innerHTML = ''; arbol(); return; }
      const r = resuelve(d, v);
      if (r.ok) { resP.innerHTML = `<div class="sim-msg ok">Lleva a <code>${r.ok}</code>. ${r.raiz ? 'Empieza por <code>/</code>: es relativa a la <b>raíz del servidor</b>, no al archivo. Con Live Server funciona; abierta con doble clic, no.' : 'Funciona igual en tu ordenador y en el servidor.'}</div>`; arbol(r.ok); }
      else { resP.innerHTML = `<div class="sim-msg mal">${r.err}</div>`; arbol(); }
    }
    pinta();
  }
});

'use strict';

function especificidad(sel) {
  let s = ' ' + sel.replace(/\s*([>+~])\s*/g, ' ').trim(); let a = 0, b = 0, c = 0;
  s = s.replace(/:(not|is|has)\(([^()]*)\)/g, (m, f, arg) => { const sp = arg.split(',').map(especificidad).sort((x, y) => y[0] - x[0] || y[1] - x[1] || y[2] - x[2])[0]; a += sp[0]; b += sp[1]; c += sp[2]; return ''; });
  s = s.replace(/:where\([^()]*\)/g, '');
  const cuenta = rx => { const n = (s.match(rx) || []).length; s = s.replace(rx, ''); return n; };
  a += cuenta(/#[\w-]+/g); b += cuenta(/\.[\w-]+/g); b += cuenta(/\[[^\]]*\]/g); c += cuenta(/::[\w-]+/g); b += cuenta(/:[\w-]+(\([^)]*\))?/g);
  c += (s.match(/(^|\s)[a-zA-Z][\w-]*/g) || []).length;
  return [a, b, c];
}
const cmpEsp = (x, y) => x[0] - y[0] || x[1] - y[1] || x[2] - y[2];

/* ---------- Contraste ---------- */
function lumHex(h) { const n = parseInt(h.slice(1), 16); const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(n >> 16 & 255) + .7152 * f(n >> 8 & 255) + .0722 * f(n & 255); }
function ratio(a, b) { const x = lumHex(a), y = lumHex(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
function hslHex(h, s, l) { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l); const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))); return '#' + [f(0), f(8), f(4)].map(x => x.toString(16).padStart(2, '0')).join(''); }
defSim('contraste', {
  t: 'Contraste de color', b: '2',
  d: 'Elige el color del texto con HSL y el del fondo. El simulador calcula el contraste y te dice si cumple las pautas de accesibilidad (WCAG).',
  mount(el) {
    const st = { h: 210, s: 15, l: 62, bg: '#ffffff' };
    const c = fila(el, 'Texto en HSL');
    rango(c, { l: 'Tono (H)', min: 0, max: 360, v: st.h, f: v => v + '°', on: v => { st.h = v; pinta(); } });
    rango(c, { l: 'Saturación (S)', min: 0, max: 100, v: st.s, f: v => v + '%', on: v => { st.s = v; pinta(); } });
    const rl = rango(c, { l: 'Luminosidad (L)', min: 0, max: 100, v: st.l, f: v => v + '%', on: v => { st.l = v; pinta(); } });
    const c2 = fila(el, 'Fondo'); pills(c2, [{ l: 'Blanco', v: '#ffffff' }, { l: 'Gris claro', v: '#eef1f5' }, { l: 'Amarillo', v: '#fff3cd' }, { l: 'Azul oscuro', v: '#14213d' }, { l: 'Negro', v: '#000000' }], it => { st.bg = it.v; pinta(); }, 0);
    const prev = add(el, '<div class="con-prev"><p class="n">Texto normal de un párrafo: 16 px.</p><p class="g">Texto grande · 24 px</p></div>');
    const res = add(el, '<div class="con-res"></div>');
    const c3 = fila(el); boton(c3, 'Buscar la luminosidad mínima que cumple AA', () => { const osc = lumHex(st.bg) > .18; for (let i = 0; i <= 100; i++) { const L = osc ? st.l - i : st.l + i; if (L < 0 || L > 100) break; if (ratio(hslHex(st.h, st.s, L), st.bg) >= 4.5) { st.l = L; rl.set(L); pinta(); return; } } }, 'sec sm');
    const msg = mensaje(el);
    function pinta() {
      const fg = hslHex(st.h, st.s, st.l); const r = ratio(fg, st.bg);
      prev.style.background = st.bg; prev.style.color = fg;
      const b = (ok, t) => `<span class="con-b ${ok ? 'ok' : 'mal'}">${ok ? '✓' : '✕'} ${t}</span>`;
      res.innerHTML = `<div class="con-r mono">${r.toFixed(2)}<small>:1</small></div><div class="con-bs">${b(r >= 4.5, 'AA texto normal (4,5)')}${b(r >= 3, 'AA texto grande (3)')}${b(r >= 7, 'AAA texto normal (7)')}</div><code>color: hsl(${st.h} ${st.s}% ${st.l}%); /* ${fg} */</code>`;
      msg(r >= 4.5 ? 'Cumple el mínimo para texto normal. Con HSL, para arreglar un contraste solo hay que mover la <b>L</b>: el tono no cambia.' : 'No cumple para texto normal. Mucha gente no lo leerá bien, sobre todo en un móvil al sol. Baja o sube la <b>luminosidad</b>.', r >= 4.5 ? 'ok' : 'mal');
    }
    pinta();
  }
});

      const o = dos.querySelector('.ma-out'); const d = MET[m];
      if (d.tipo === 'map' || d.tipo === 'filter' || d.tipo === 'sort') o.innerHTML = '<div class="ma-arr">' + (out.length ? out.map(p => card(p, 'nuevo')).join('') : '<span class="muted">[ ]</span>') + '</div>';
      else if (d.tipo === 'find') o.innerHTML = fin === null ? '<span class="muted">…</span>' : fin ? card(fin, 'nuevo') : '<code>undefined</code>';
      else if (d.tipo === 'reduce') o.innerHTML = `<div class="ma-acc mono">acc = <b>${acc.toFixed(2)}</b></div>`;
      else o.innerHTML = fin === null ? '<span class="muted">…</span>' : `<code class="big">${fin}</code>`;
    }
    function paso() {
      const d = MET[m]; if (parado || i >= P.length - 1) { terminado(); return false; }

      if (d.tipo === 'map') { out.push(d.f(p)); t = d.cb(p); }
      else if (d.tipo === 'filter') { const r = d.f(p); if (r) out.push(p); t = d.cb(p) + (r ? ' → se queda' : ' → fuera'); }
      else if (d.tipo === 'find') { const r = d.f(p); t = d.cb(p); if (r) { fin = p; parado = true; t += ' → ¡encontrado! Deja de recorrer'; } }
      else if (d.tipo === 'some') { const r = d.f(p); t = d.cb(p); if (r) { fin = true; parado = true; t += ' → con uno basta: true'; } }
      else if (d.tipo === 'every') { const r = d.f(p); t = d.cb(p); if (!r) { fin = false; parado = true; t += ' → con uno que falle basta: false'; } }

    }, true);

  }

    const hd = panel.querySelector('header'); const ch = hd.querySelector('.chip.ok'); if (nuevo && !ch) hd.querySelector('h3').insertAdjacentHTML('beforebegin', '<span class="chip ok">Hecho</span>'); if (!nuevo && ch) ch.remove();
    const t = $(`.tab[aria-controls="${panel.id}"] .tl`); if (t) { const o = t.querySelector('.ok'); if (nuevo && !o) t.insertAdjacentHTML('beforeend', ' <span class="ok">✓</span>'); if (!nuevo && o) o.remove(); }
    const s = APP.porId[k.split(':')[0]]; const ps = $('.progreso-ses'); if (ps && s) ps.innerHTML = `<span class="small"><b>${nHechos(s)}</b> de ${s.ejercicios.length} ejercicios hechos</span><div class="barra"><i style="width:${nHechos(s) / s.ejercicios.length * 100}%"></i></div>`;
    if (nuevo) tosta(sesionCompleta(s) ? '¡Sesión completa!' : 'Marcado como hecho.');
    return;
  }
  if (acc === 'pista') {
    const { e } = localiza(k); const zona = document.querySelector(`[data-zona="${k}"]`); const n = +(zona.dataset.pistas || 0);
    if (n >= e.pistas.length) { tosta('No hay más pistas para este ejercicio.'); return; }
    zona.dataset.pistas = n + 1; const d = document.createElement('div'); d.className = 'desplegable pista md'; d.innerHTML = `<p><span class="et">Pista ${n + 1} de ${e.pistas.length}</span></p>` + md(e.pistas[n]); zona.appendChild(d); return;
  }
  if (acc === 'verif') { VERIF.ej = k; VERIF.res = null; ve('verif'); return; }
  if (acc === 'sol') {
    const { e } = localiza(k); const zona = document.querySelector(`[data-zona="${k}"]`);
    if (solVista(k) || zona.dataset.conf === '1') { muestraSol(zona, e, k); return; }
    zona.dataset.conf = '1'; const d = document.createElement('div'); d.className = 'desplegable';
    d.innerHTML = `<p class="aviso-sol">Antes de mirar: ¿lo has intentado de verdad?</p><p>Equivocarse y corregir fija mucho más que leer la respuesta correcta. Si abres la solución sin haber peleado un rato, el ejercicio no te va a servir de nada.</p><div class="acciones" style="border:0;padding-bottom:0"><button class="b" data-acc="sol" data-k="${k}" type="button">Lo he intentado, enséñamela</button><button class="b sec" data-acc="cancela" data-k="${k}" type="button">Sigo intentándolo</button></div>`;
    zona.appendChild(d); return;
  }
  if (acc === 'cancela') { const zona = document.querySelector(`[data-zona="${k}"]`); zona.dataset.conf = ''; zona.querySelectorAll('.desplegable').forEach(x => { if (x.querySelector('.aviso-sol')) x.remove(); }); return; }
  if (acc === 'resp') {
    const { q } = localizaPreg(k); if (!q || APP.estado.q[k]) return; const op = +el.dataset.op;
    APP.estado.q[k] = { ok: op === q.buena, op }; guarda();
    const box = el.closest('.preg'); const n = box.querySelector('.qn'); box.outerHTML = pregunta(q, k, box.classList.contains('diag') ? 'diag' : '', n ? +n.textContent : 0);
    return;
  }
  if (acc === 'correr') { correVerif(); return; }
  if (acc === 'limpiar') { VERIF.html = ''; VERIF.css = ''; VERIF.js = ''; VERIF.res = null; pinta(); return; }
  if (acc === 'exportar') { exporta(); return; }
  if (acc === 'importar') { importa(); return; }
  if (acc === 'borrar') { document.querySelector('[data-zona="borrado"]').innerHTML = `<div class="desplegable"><p class="aviso-sol">Esto borra todo tu progreso y no se puede deshacer.</p><p>Exporta antes si quieres conservarlo.</p><div class="acciones" style="border:0;padding-bottom:0"><button class="b" data-acc="borrar2" type="button">Sí, bórralo todo</button><button class="b sec" data-acc="borrarno" type="button">Mejor no</button></div></div>`; return; }
  if (acc === 'borrarno') { document.querySelector('[data-zona="borrado"]').innerHTML = ''; return; }
  if (acc === 'borrar2') { APP.estado = molde(); guarda(); pintaRail(); pinta(); tosta('Progreso borrado.'); return; }
});
function localiza(k) { const [sid, c] = k.split(':'); const s = APP.porId[sid]; const i = c === 'undefined' ? 3 : 'ABC'.indexOf(c); return { s, e: s.ejercicios[i] }; }
function localizaPreg(k) { const [sid, resto] = k.split(':'); const s = APP.porId[sid]; if (!s) return {}; if (resto === 'd') return { s, q: s.diag }; return { s, q: s.auto[+resto.slice(1)] }; }
async function exporta() {
  const datos = JSON.stringify({ app: 'lenguajes-de-marcas', sello: APP.sello, estado: APP.estado }, null, 1);
  const nombreArch = 'lm-' + (APP.estado.alumno || 'progreso').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + new Date().toISOString().slice(0, 10) + '.json';
  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) { }
    if (dl) { try { await dl.save({ filename: nombreArch, data: datos }); tosta('Archivo guardado.'); } catch (e) { if (!e || e.code !== 'declined') tosta('No se ha podido guardar el archivo aquí. Descarga la versión en archivo del curso.', true); } return; }
  }
  const b = new Blob([datos], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  const nom = (APP.estado.alumno || 'progreso').toLowerCase().replace(/[^a-z0-9]+/g, '-'); a.download = 'lm-' + nom + '-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); tosta('Archivo descargado.');
}
function importa() {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json,.json';
  i.addEventListener('change', async () => { const f = i.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); APP.estado = sanea(j.estado || j); guarda(); pintaRail(); pinta(); tosta('Progreso importado.'); } catch (e) { tosta('Ese archivo no se puede leer.', true); } });
  i.click();
}
function muestraSol(zona, e, k) {
  if (zona.dataset.sol === '1') return; zona.dataset.sol = '1';
  zona.querySelectorAll('.desplegable').forEach(x => { if (x.querySelector('.aviso-sol')) x.remove(); });
  marcaEj(k, 'sol', true); const d = document.createElement('div'); d.className = 'desplegable sol md'; d.innerHTML = `<p><span class="et">Solución</span></p>` + md(e.solucion); zona.appendChild(d);
}

/* ---------- teclado ---------- */
document.addEventListener('keydown', ev => {
  const pal = !$('#paleta').hidden;
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); pal ? cierraPaleta() : abrePaleta(); return; }
  if (ev.key === '/' && !pal && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { ev.preventDefault(); abrePaleta(); return; }
  if (pal) { if (ev.key === 'Escape') cierraPaleta(); else if (ev.key === 'ArrowDown') { ev.preventDefault(); mueveSel(1); } else if (ev.key === 'ArrowUp') { ev.preventDefault(); mueveSel(-1); } else if (ev.key === 'Enter') { ev.preventDefault(); eligePal(PAL.sel); } return; }
  if (ev.key === 'Escape') cierraMenu();
});

/* ---------- arranque ---------- */
$('#btnMenu').addEventListener('click', () => $('#rail').classList.contains('abierto') ? cierraMenu() : abreMenu());
$('#velo').addEventListener('click', cierraMenu);
$('#palIn').addEventListener('input', e => filtraPaleta(e.target.value));
window.addEventListener('popstate', () => { const r = deToken(location.hash); ve(r.v, r.id, true); });
aplicaTema();
(async function () {
  let crudoSes, crudoCon;
  try { crudoSes = await inflaBase64(DATOS_Z.s); crudoCon = await inflaBase64(DATOS_Z.c); }
  catch (e) { $('#vista').innerHTML = '<h1>No se ha podido abrir el curso</h1><p>Este navegador no puede descomprimir el contenido. Prueba con una versión reciente de Chrome, Firefox o Safari.</p>'; return; }
  APP.sesiones = parseaSesiones(crudoSes); APP.conceptos = parseaConceptosPlano(crudoCon);
  APP.sesiones.forEach(s => APP.porId[s.id] = s); APP.conceptos.forEach(c => APP.refId[c.id] = c);
  await carga();
  const r = deToken(location.hash); APP.vista = { v: r.v, id: r.id || null };
  if (r.v === 'sesion') { UI.ultima = r.id; guardaUI(); }
  pintaRail(); pinta();
})();
</script>
